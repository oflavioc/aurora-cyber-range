# CONTRATO — Envelope de evento e catalogo fechado
#
# Autoridade: 09_EVENT_MODEL.md secoes 1, 2 e 4.
#
# REGISTRO FECHADO. event_type fora deste catalogo e rejeitado na emissao e
# falha no CI (06_ACCEPTANCE_TESTS.md T2).
#
# O motivo esta em 09 secao 4: um event_type com erro de digitacao NUNCA
# dispara. O marcador de evidencia silenciosamente nao e coletado, o objetivo
# nunca e satisfeito, a branch nunca ramifica — e ninguem percebe ate o
# exercicio ao vivo. E a falha mais cara possivel.
#
# `tools/_common.py::load_declared_event_types` le o catalogo pelos `$defs`
# prefixados `event_type_`. `tools/codegen.py` gera as constantes em
# contracts/generated/events.py e events.ts.
#
# Ver contracts/README.md para o subconjunto YAML e as extensoes x-aurora-*.

$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://aurora-cyber-range.local/contracts/events.schema.json'
title: Envelope de evento
x-aurora-contract: events
x-aurora-schema-version: 1

type: object

# Envelope universal — 09 secao 1.1, mais `clock_multiplier` por 00 secao 5.6.
#
# `clock_multiplier` NAO consta da lista de 09 secao 1.1, mas 00_MASTER_SPEC.md
# secao 5.6 e taxativo: "Dois relogios, sempre. Todo evento carrega
# `exercise_time` e `wall_timestamp`, MAIS `clock_multiplier`". CLAUDE.md
# ("Autoridade") resolve: em conflito, o MASTER_SPEC prevalece. Nao e escalacao
# — escalacao e para conflito entre dois documentos NAO-master.
#
# 06 T4 e 07 linha 76 repetem a exigencia, e 01 secao 3 explica o custo de
# perde-la: sem o multiplicador em cada evento, a timeline do AAR nao e
# reconstruivel. A forma anterior declarava o campo e nao o exigia — H2 da
# segunda auditoria da Fase 1, a mesma classe do P1-12 na direcao oposta: la o
# contrato recusava o que a spec exige, aqui aceitava o que ela proibe.
#
# `exercise_timestamp` entrou pelo mesmo spec-change. 01 secao 3 diz "tres
# marcas temporais, nunca uma so" e 09 secao 1.1 nao o exigia — conflito entre
# dois documentos NAO-master, que CLAUDE.md manda escalar em vez de resolver por
# inferencia. Escalado, decidido, e 09 secao 1.1 corrigido: sem ele, evento de
# epoch 2 e evento de epoch 0 nao sao ordenaveis entre si na linha do exercicio.
required:
  - event_id
  - event_type
  - truth_layer
  - producer
  - exercise_time
  - exercise_timestamp
  - wall_timestamp
  - clock_multiplier
  - simulation_epoch

properties:
  event_id:
    type: string
    minLength: 1
  event_type:
    $ref: '#/$defs/event_type'
  truth_layer:
    $ref: '#/$defs/truth_layer'
  producer:
    type: string
    minLength: 1
  actor_id:
    type: string
    minLength: 1
  persona:
    type: string
    minLength: 1

  # Tres marcas temporais, nunca uma so — 01_ARCHITECTURE.md secao 3.
  exercise_time:
    type: string
    minLength: 1
  exercise_timestamp:
    type: string
    minLength: 1
  wall_timestamp:
    type: string
    minLength: 1
  clock_multiplier:
    type: number
    exclusiveMinimum: 0

  # Rollback nunca apaga historia: gera evento explicito e nova epoch
  # (00_MASTER_SPEC.md secao 6). Epoch e o que separa as linhas temporais.
  #
  # COMECA EM ZERO. 09 secao 3 desenha `epoch 0` antes do primeiro rollback e
  # `epoch 1` depois dele, e 06 secao T3 exige normativamente que "evento de
  # participant_action gravado na EPOCH 0 continua legivel apos rollback". Um
  # piso em 1 recusaria todo evento da primeira linha temporal — inclusive o
  # evento que aquele teste de aceitacao obriga a existir.
  #
  # A forma anterior deste contrato declarava `minimum: 1`, invencao minha
  # contra criterio normativo explicito. Achado pelo checkpoint-auditor.
  simulation_epoch:
    type: integer
    minimum: 0

  # -------------------------------------------------------------------------
  # CORRELACAO — 09 secao 1.
  #
  # `fact_id` mora AQUI, nao no topo. A forma anterior o declarava como
  # propriedade de topo citando "09 secao 1" — que e exatamente a secao onde ele
  # aparece DENTRO de `correlation`, junto de `scenario_id`, `inject_id` e
  # `causation_id`. Os outros tres nao existiam no contrato. H1 da primeira
  # auditoria da Fase 1, repetido na segunda por nao ter sido corrigido nem
  # registrado.
  #
  # A Fase 2 constroi event store, cadeia de causacao e correlacao de branch
  # sobre este contrato: `causation_id` e `inject_id` sao o que sustenta os dois.
  #
  # Nao e obrigatorio — 09 secao 1.1 nao o lista entre os campos exigidos, e um
  # `exercise_started` nao tem inject nem causa anterior.
  correlation:
    $ref: '#/$defs/correlation'

  # `object` e `payload` do envelope de 09 secao 1. Ficam ABERTOS por dentro: a
  # forma varia por event_type e os schemas de payload chegam na Fase 2. O que
  # se fecha aqui e a unica regra que vale para todos — `objective_ids` nao
  # entra em nivel nenhum (09 secao 1.2).
  object:
    type: object
    not:
      required: [objective_ids]

  payload:
    type: object
    not:
      required: [objective_ids]

# ---------------------------------------------------------------------------
# PROIBIDO NO ENVELOPE — 09 secao 1.2.
#
# `objective_ids` nao e emitido. O binding evento -> objetivo ocorre na
# projecao, via observability_hooks.yaml. Se a academus-api precisasse saber que
# uma consulta satisfaz OBJ-03, o dominio passaria a conhecer o desenho de
# exercicio e a fronteira core/adapter vazaria.
#
# Guardado tambem por tools/check_event_envelope.py, por AST, no ponto de
# emissao. Aqui a garantia e sobre o documento; la, sobre o codigo.
# ---------------------------------------------------------------------------
not:
  required: [objective_ids]

# `additionalProperties` fica ABERTO de proposito: o payload varia por
# event_type e seus schemas chegam na Fase 2. Fechar agora recusaria todo evento
# com payload.

allOf:
  # actor_id e persona sao obrigatorios quando a camada e de pessoa — 09 secao 1.1.
  - if:
      required: [truth_layer]
      properties:
        truth_layer:
          const: participant_action
    then:
      required: [actor_id, persona]

  - if:
      required: [truth_layer]
      properties:
        truth_layer:
          const: evaluator_assessment
    then:
      required: [actor_id, persona]

  # ---------------------------------------------------------------------------
  # event_type PERTENCE a camada declarada.
  #
  # Nada verificava isto antes: `containment_declared` com truth_layer
  # `ground_truth` passava. Seria acao de participante gravada como verdade do
  # incidente — a confusao exata que 00 secao 3 existe para impedir.
  # ---------------------------------------------------------------------------
  - if:
      required: [truth_layer]
      properties:
        truth_layer:
          const: ground_truth
    then:
      properties:
        event_type:
          $ref: '#/$defs/event_type_ground_truth'

  - if:
      required: [truth_layer]
      properties:
        truth_layer:
          const: observable_evidence
    then:
      properties:
        event_type:
          $ref: '#/$defs/event_type_observable_evidence'

  - if:
      required: [truth_layer]
      properties:
        truth_layer:
          const: participant_action
    then:
      properties:
        event_type:
          $ref: '#/$defs/event_type_participant_action'

  - if:
      required: [truth_layer]
      properties:
        truth_layer:
          const: evaluator_assessment
    then:
      properties:
        event_type:
          $ref: '#/$defs/event_type_evaluator_assessment'

  - if:
      required: [truth_layer]
      properties:
        truth_layer:
          const: facilitation
    then:
      properties:
        event_type:
          $ref: '#/$defs/event_type_facilitation'

  # ---------------------------------------------------------------------------
  # PAYLOAD POR event_type — o primeiro, e o motivo dele estar sozinho.
  #
  # `payload` continua ABERTO para os outros 32 tipos. Fechar todos de uma vez
  # seria escrever 32 contratos sem consumidor; cada um nasce quando o seu
  # consumidor nasce. Este nasce agora porque tem DOIS: o fold exige
  # `to_event_id` para ancorar o corte, e o item 7 da DoD da Fase 2 exige o
  # intervalo congelado.
  # ---------------------------------------------------------------------------
  - if:
      required: [event_type]
      properties:
        event_type:
          const: rollback_performed
    then:
      required: [payload]
      properties:
        payload:
          $ref: '#/$defs/rollback_payload'

  # SEGUNDO PAYLOAD POR event_type, e nasce pelo mesmo motivo que o primeiro:
  # quando o consumidor nasce. O consumidor e o computador de metrica da Fase 6 —
  # 00 secao 3.2 exige que a SELECAO DE START seja calculo dele sobre o payload,
  # e nao recorte de quem monta o insumo. Sem estes dois campos, TTA e TTCM nao
  # tem start e a selecao seria feita contra criterio nenhum.
  - if:
      required: [event_type]
      properties:
        event_type:
          const: inject_fired
    then:
      required: [payload]
      properties:
        payload:
          $ref: '#/$defs/inject_fired_payload'

$defs:

  # -------------------------------------------------------------------------
  # CORRELACAO — 09 secao 1.
  #
  # Fechado por `additionalProperties: false`: os quatro campos sao os que a
  # spec declara, e chave nova aqui e erro de autoria, nao extensao.
  #
  # `inject_id` e `scenario_id` NAO levam `x-aurora-ref`. Eles resolvem contra o
  # pacote CARREGADO em tempo de execucao, nao contra os exemplos dos contratos:
  # o envelope nao e documento de pack, e amarra-lo ao mini-pacote de fixture
  # seria inventar um acoplamento que nao existe. A resolucao real e obrigacao
  # do event store, na Fase 2 — registrada em x-aurora-linter-rules.
  # -------------------------------------------------------------------------
  correlation:
    type: object
    additionalProperties: false
    properties:
      scenario_id:
        type: string
        minLength: 1
      inject_id:
        type: string
        minLength: 1
      causation_id:
        type: string
        minLength: 1
      # Presente e NULO quando o evento nao projeta fato canonico — e o que
      # 09 secao 1 mostra. Nulo e ausente significam a mesma coisa aqui, e
      # aceitar os dois evita obrigar o emissor a escolher.
      fact_id:
        type: [string, 'null']

  # -------------------------------------------------------------------------
  # CINCO VALORES, QUATRO VERDADES — 00_MASTER_SPEC.md secao 3.1.
  #
  # As quatro primeiras camadas afirmam algo sobre o INCIDENTE. `facilitation`
  # afirma algo sobre a MAQUINA DE EXERCICIO, e por isso e ortogonal ao modelo
  # em vez de ser uma quinta camada dele.
  # -------------------------------------------------------------------------
  truth_layer:
    enum:
      - ground_truth
      - observable_evidence
      - participant_action
      - evaluator_assessment
      - facilitation

  event_type:
    anyOf:
      - $ref: '#/$defs/event_type_ground_truth'
      - $ref: '#/$defs/event_type_observable_evidence'
      - $ref: '#/$defs/event_type_participant_action'
      - $ref: '#/$defs/event_type_evaluator_assessment'
      - $ref: '#/$defs/event_type_facilitation'

  event_type_ground_truth:
    enum:
      - fact_materialized
      - attack_stage_reached
      - verification_predicate_satisfied

  event_type_observable_evidence:
    enum:
      - evidence_source_released
      - evidence_source_accessed
      - telemetry_emitted

  event_type_participant_action:
    enum:
      - inject_viewed
      - audit_query_performed
      - evidence_source_opened
      - incident_declared
      # Declarar que sao DOIS incidentes e acao distinta de declarar UM: e o
      # objeto do OBJ-03. Acrescentado no spec-change
      # `facilitation-e-separate-incident`.
      - separate_incident_declared
      - classification_declared
      - containment_declared
      - service_restoration_declared
      - integrity_validation_declared
      - assessment_submitted
      - communication_submitted
      - regulatory_notice_submitted
      - continuity_action_taken
      - vpn_access_revoked
      - identity_scope_disabled
      - decision_made
      - capability_gap_declared

  event_type_evaluator_assessment:
    enum:
      - bars_score_submitted
      - observed_marker_set
      - qualitative_note_added

  event_type_facilitation:
    enum:
      - inject_fired
      - rollback_performed
      - branch_selected
      - exercise_started
      - exercise_paused
      # CONTINUAR ganha rastro. Acrescentado no spec-change `exercise-resumed`:
      # 01 secao 6 da quatro comandos de execucao ao console e o catalogo tinha
      # evento para tres. Sem este, `exercise_paused` sem nada depois e o mesmo
      # fluxo para "ainda pausado" e para "retomado e nada aconteceu" — e a
      # heuristica de "evento posterior implica retomada" nao vale, porque o
      # disparo MANUAL continua permitido na pausa (01 secao 3 bloqueia so o
      # agendado).
      #
      # A duracao da pausa NAO precisa de campo: e a distancia entre os
      # `wall_timestamp` dos dois eventos. Extremos, nunca duracao — a forma
      # que 06 T3 ja fixou —, e em tempo de PAREDE porque as duas marcas de
      # exercicio congelam na pausa e mediriam zero.
      - exercise_resumed
      - exercise_reset

  # -------------------------------------------------------------------------
  # Taxonomia de motivo de rollback — 09 secao 3.1.
  #
  # Rotulo sem consequencia nao serve. Cada motivo tem efeito definido no AAR e
  # nas metricas, e o conjunto e fechado pelo mesmo motivo do catalogo. O
  # payload de `rollback_performed` chega na Fase 2 e referencia este $def.
  # -------------------------------------------------------------------------
  rollback_reason:
    enum:
      - technical_failure
      - rehearsal
      - facilitation
      - adjudication

  # -------------------------------------------------------------------------
  # PAYLOAD DE `rollback_performed` — 01 secao 4.2 e 06 T3. Fecha a P2-4 e o
  # item 7 da DoD da Fase 2.
  #
  # E O PRIMEIRO SCHEMA DE PAYLOAD POR event_type, e por enquanto o unico. O
  # `payload` do envelope continua aberto para os demais tipos: fechar todos de
  # uma vez seria desenhar 32 contratos sem consumidor, e cada um deles nasce
  # quando o seu consumidor nasce. Este nasce agora porque o fold JA o exige —
  # `to_event_id` e chave de facto desde a projecao, e o item 7 cobra o
  # intervalo.
  #
  # FECHADO POR `additionalProperties: false`, ao contrario do payload generico.
  # Aqui a lista de chaves e conhecida e pequena, e chave nova sem contrato e
  # erro de digitacao que em runtime vira campo que ninguem le — a mesma classe
  # do event_type inexistente de 09 secao 4.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # PAYLOAD DE `inject_fired` — 03 secao 3, "Impacto observavel, definido", e
  # 00 secao 3.2. Fecha a P6-2 pelo ramo (b): DERIVACAO DO MOTOR.
  #
  # `observable_impact` NAO e campo de pack. O predicado das tres pernas —
  # `effects`, `materializes_facts` com fato que tenha `projections`, e
  # `evidence_release` — e avaliado NA CARGA, e o inject-engine carimba o
  # resultado. Um campo no pack seria segunda fonte para o mesmo fato,
  # divergiria do conteudo em silencio, e poria em maos de autoria a decisao de
  # quando a metrica comeca a correr.
  #
  # `requires_response` VEM do pack — `media_event.requires_response` de 04
  # secao 7 —, e a assimetria e deliberada: quem sabe se um inject exige
  # resposta e quem o escreveu; se ele tem impacto observavel e consequencia do
  # que ele declara, e nao juizo a parte.
  #
  # FECHADO POR `additionalProperties: false`, como o de rollback: a lista de
  # chaves e conhecida e pequena, e chave nova sem contrato vira campo que
  # ninguem le.
  # -------------------------------------------------------------------------
  inject_fired_payload:
    type: object
    required:
      - observable_impact
      - requires_response
    additionalProperties: false
    properties:

      # O start de TTA — 03 secao 3. Derivado, nunca declarado.
      observable_impact:
        type: boolean

      # O start de TTCM. `false` quando o inject nao tem `media_event`.
      requires_response:
        type: boolean

  rollback_payload:
    type: object
    required:
      - to_event_id
      - reason
      - by_user
      - role
    additionalProperties: false
    properties:

      # ANCORA DO CORTE, por `event_id`. `01` secao 4.2 lista `to_inject_id`, que
      # e o rotulo legivel; quem ancora e este, porque localizar o corte por
      # inject exigiria varrer `inject_fired` — dependencia de uma projecao de
      # estado num evento de facilitacao que nada na spec autoriza.
      to_event_id:
        type: string
        minLength: 1

      # NULO E FORMA LEGITIMA: a ancora nem sempre e um `inject_fired`. Rebobinar
      # ate o `exercise_started` e caso real — e o facilitador voltando ao
      # inicio —, e ali nao ha inject a nomear.
      to_inject_id:
        type: [string, 'null']

      by_user:
        type: string
        minLength: 1

      role:
        type: string
        minLength: 1

      reason:
        $ref: '#/$defs/rollback_reason'

      frozen_interval:
        $ref: '#/$defs/frozen_interval'

    # `technical_failure` EXIGE o intervalo, e os outros tres nao o admitem por
    # obrigacao — 09 secao 3.1 da o efeito "relogio de metricas congelado" a
    # este motivo e so a ele.
    #
    # Sem esta condicional o campo seria opcional em todo rollback, e um
    # `technical_failure` gravado sem intervalo passaria: a Fase 6 o leria como
    # se nao houvesse congelamento, e o desconto sumiria sem nada acusar. E o
    # buraco que o item 7 existe para fechar.
    if:
      required: [reason]
      properties:
        reason:
          const: technical_failure
    then:
      required: [frozen_interval]

  # -------------------------------------------------------------------------
  # O INTERVALO CONGELADO — 06 T3, e a forma la e normativa.
  #
  # EXTREMOS, NUNCA DURACAO. Duracao impede unir intervalos que se sobrepoem:
  # dois congelamentos cruzados contariam o trecho comum duas vezes, e a duracao
  # ja somada nao guarda com que detectar isso. T10 exige uniao, e e o registro
  # por extremos que a torna possivel.
  #
  # EM `exercise_timestamp`, e T3 percorre os outros tres e descarta cada um:
  # `wall_timestamp` nao, porque o PAUSAR o avanca sem avancar o exercicio;
  # `exercise_time` nao, porque rebobina no rollback e os dois extremos caem em
  # epochs diferentes POR CONSTRUCAO em todo congelamento.
  #
  # SEM `pattern`, de proposito: o `exercise_timestamp` do envelope tambem nao
  # tem. Inventar aqui um formato que o campo de origem nao exige seria exigir de
  # uma copia mais do que do original.
  # -------------------------------------------------------------------------
  frozen_interval:
    type: object
    required: [start, end]
    additionalProperties: false
    properties:
      start:
        type: string
        minLength: 1
      end:
        type: string
        minLength: 1

# ---------------------------------------------------------------------------
# EFFECT_CLASS — 09 secao 4.0, acrescentada pelo spec-change
# `effect-class-marcas-temporais-e-seed`.
#
# `truth_layer` responde QUEM AFIRMA. `effect_class` responde QUE ESPECIE DE
# COISA O EVENTO E. Sao ortogonais: `vpn_access_revoked` e `containment_declared`
# sao ambos `participant_action`, e o primeiro e `state_effect` porque o acesso
# caiu independente de qualquer declaracao.
#
# PARA QUE SERVE: a folha `event` de um predicado de verificacao so pode
# referenciar `state_effect` (03 secao 3.1). Sem isso,
# `containment: {all: [{event: containment_declared}]}` e pack valido, TTCD e
# TTCV medem o mesmo instante, e o delta que 03 secao 3.2 chama de "o achado"
# deixa de existir sem que nada falhe.
#
# `verification_predicate_satisfied` e `machine` e isto nao admite excecao: como
# `state_effect`, um predicado poderia referenciar o evento que ele proprio emite
# ao ser satisfeito.
#
# COBERTURA EXATA e verificada por scripts/check_contract_examples.py: todo tipo
# do catalogo tem classe, nenhuma classe orfa, nenhum valor fora do conjunto. Sem
# essa checagem, esta tabela e uma SEGUNDA copia da lista de 32 e divergiria da
# primeira em silencio.
# ---------------------------------------------------------------------------
x-aurora-registry:

  effect_class_values: [state_effect, declaration, observation, machine]

  # ---------------------------------------------------------------------------
  # METRIC_SIDE — 00 secao 3.2, acrescentado pelo spec-change
  # `particao-das-metricas-pareadas`.
  #
  # `effect_class` responde QUE ESPECIE DE COISA O EVENTO E. `metric_side`
  # responde QUAL COMPUTADOR DE METRICA PODE LE-LO. Sao ortogonais, e o segundo
  # NAO e derivavel do primeiro — a derivacao foi tentada e reprova nos dois
  # sentidos:
  #
  #   - `verification_predicate_satisfied` e `machine`, como `inject_fired`, e
  #     so um dos dois e veredito;
  #   - `assessment_submitted` e `declaration` e e o insumo do limiar que decide
  #     TTIV (03 secao 3.3).
  #
  # PARA QUE SERVE: 00 secao 3.2 exige que o computador de cada metrica receba
  # apenas os eventos do seu lado, mais a escrituracao de epoch e os escalares
  # do insumo tipado — e que so o AAR tenha as duas metades de um par. Uma regra
  # fecha os dois defeitos: metrica simples lendo veredito, e TTCD computado de
  # TTCV. E 09 secao 4.0 usa `verification` como a segunda perna da conjuncao
  # que decide o que uma folha de predicado pode referenciar.
  #
  # `epoch` vai AOS DOIS LADOS de proposito. O desconto por uniao e a exclusao
  # de `rehearsal` sao computacao do consumidor, testada em 06 T10; recorta-los
  # na montagem faria o numero certo aparecer por AUSENCIA DE INSUMO em vez de
  # por calculo, e evento perdido por defeito ficaria indistinguivel de evento
  # corretamente descontado.
  #
  # COBERTURA EXATA e DISJUNCAO sao verificadas em
  # range-core/engine/loader/contract_rules.py, junto da cobertura de
  # `effect_class` e pelo mesmo motivo: sem isso esta tabela e uma TERCEIRA
  # copia da lista de 33 tipos e divergiria das outras duas em silencio.
  # ---------------------------------------------------------------------------
  metric_side_values: [declaration, verification, epoch, none]

  metric_side:
    # --- verification: o que decide o instante por fora da declaracao ---
    fact_materialized: verification
    attack_stage_reached: verification
    verification_predicate_satisfied: verification
    vpn_access_revoked: verification
    identity_scope_disabled: verification
    continuity_action_taken: verification
    # `declaration` por classe, `verification` por papel: e o insumo do limiar
    # de calibracao que decide TTIV. E o caso que prova que lado nao se deriva
    # de `effect_class`.
    assessment_submitted: verification

    # --- declaration: o que a equipe afirma, e os starts ---
    incident_declared: declaration
    separate_incident_declared: declaration
    classification_declared: declaration
    containment_declared: declaration
    service_restoration_declared: declaration
    integrity_validation_declared: declaration
    # Stop de TTCM (03 secao 3, OBJ-08 e OBJ-09). Sao `state_effect` por
    # classe, e e por isso que a folha de predicado precisa da CONJUNCAO: sem a
    # segunda perna eles seriam referenciaveis e cairiam nos dois lados.
    communication_submitted: declaration
    regulatory_notice_submitted: declaration
    # Start de TTA e de TTCM. Quais injects se qualificam e calculo do
    # consumidor sobre o payload, nunca recorte do montador — 00 secao 3.2.
    inject_fired: declaration

    # --- epoch: escrituracao, entregue AOS DOIS lados ---
    rollback_performed: epoch
    exercise_started: epoch
    exercise_paused: epoch
    exercise_resumed: epoch
    exercise_reset: epoch

    # --- none: nenhum computador de metrica le ---
    #
    # `decision_made` e `capability_gap_declared` sao `declaration` por classe e
    # estao AQUI: nenhuma das nove siglas de 03 secao 3 os consome, e quem os le
    # e o AAR, que nao e computador de metrica. Lado e sobre QUEM PODE LER, nao
    # sobre a especie do evento.
    evidence_source_released: none
    evidence_source_accessed: none
    telemetry_emitted: none
    inject_viewed: none
    audit_query_performed: none
    evidence_source_opened: none
    decision_made: none
    capability_gap_declared: none
    bars_score_submitted: none
    observed_marker_set: none
    qualitative_note_added: none
    branch_selected: none

  effect_class:
    fact_materialized: state_effect
    attack_stage_reached: state_effect
    verification_predicate_satisfied: machine

    evidence_source_released: machine
    evidence_source_accessed: observation
    telemetry_emitted: machine

    inject_viewed: observation
    audit_query_performed: observation
    evidence_source_opened: observation
    incident_declared: declaration
    separate_incident_declared: declaration
    classification_declared: declaration
    containment_declared: declaration
    service_restoration_declared: declaration
    integrity_validation_declared: declaration
    assessment_submitted: declaration
    # O CONTEUDO e afirmacao; o ATO tem efeito externo — o publico soube, o
    # regulador foi notificado. A classificacao segue o ato, e o conteudo
    # continua tratado como afirmacao em 04 secao 7, que compara o numero
    # comunicado com o ground truth.
    communication_submitted: state_effect
    regulatory_notice_submitted: state_effect
    continuity_action_taken: state_effect
    vpn_access_revoked: state_effect
    identity_scope_disabled: state_effect
    # A opcao escolhida carrega `effects` que mutam flags, mas QUEM MUTA O
    # ESTADO SAO OS EFFECTS, NAO O EVENTO. `decision_made` registra que a equipe
    # ESCOLHEU, e escolher e afirmacao — do mesmo tipo que `containment_declared`.
    #
    # Como `state_effect`, `containment: {all: [{event: decision_made}]}` seria
    # satisfeito no instante do clique, ANTES DE QUALQUER EFEITO EXISTIR: o
    # buraco que este campo existe para fechar, com outro nome.
    #
    # Quando um cenario precisar que uma decisao conte como contencao
    # verificada, o caminho e o `effect` dela materializar um fato e o predicado
    # referenciar esse fato — decisao -> efeito -> estado observavel.
    decision_made: declaration
    capability_gap_declared: declaration

    bars_score_submitted: declaration
    observed_marker_set: declaration
    qualitative_note_added: declaration

    inject_fired: machine
    rollback_performed: machine
    branch_selected: machine
    exercise_started: machine
    exercise_paused: machine
    exercise_resumed: machine
    exercise_reset: machine

