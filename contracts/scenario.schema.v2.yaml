# CONTRATO — Pacote de cenario, schema v2
#
# Autoridade: 04_SCENARIO_SCHEMA.md secoes 1, 2, 4, 5, 6 e 7.
#
# REGRA DE VERSIONAMENTO (04 secao 4): NUNCA alterar semantica de campo dentro
# da mesma schema_version. Engine declara SUPPORTED_SCHEMA_VERSIONS = [N, N-1];
# pack em N-1 carrega com migracao em memoria e aviso no boot; anterior a N-1 e
# recusado com instrucao de migracao.
#
# A RAIZ deste schema valida `manifest.yaml`. Os arquivos irmaos do pack tem
# ponteiro proprio, declarado em `x-aurora-documents`.
#
# Ver contracts/README.md para o subconjunto YAML e as extensoes x-aurora-*.

$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://aurora-cyber-range.local/contracts/scenario.schema.v2.json'
title: Manifesto de pacote de cenario
x-aurora-contract: scenario
x-aurora-schema-version: 2

# ---------------------------------------------------------------------------
# ESTRUTURA DO PACOTE — 04 secao 1.
# ---------------------------------------------------------------------------
x-aurora-documents:
  manifest.yaml: '#'
  injects.yaml: '#/$defs/injects_document'
  branches.yaml: '#/$defs/branches_document'

# PACOTE COMPLETO x PACOTE APENAS-MANIFESTO — 04 secoes 1 e 9.
#
# A forma anterior declarava `ground_truth.yaml`, `objectives.yaml` e
# `injects.yaml` como `required`, o que recusaria DOIS dos quatro pacotes que a
# spec manda entregar: `vazamento-lgpd` e `pesquisa-comprometida` sao "apenas
# manifesto, sem injects", e existem justamente para "validar que o loader lida
# com pacote incompleto".
#
# Ou o loader da Fase 7 recusaria dois pacotes normativos, ou ignoraria este
# registro — e registro ignorado e prosa marcada como contrato. M1 da terceira
# auditoria.
x-aurora-registry:
  package_files:
    # Sem manifesto nao ha pacote: e ele que declara `pack_id` e
    # `schema_version`, sem os quais o loader nao sabe nem o que esta lendo.
    required:
      - manifest.yaml
    # Exigidos apenas do pacote COMPLETO. O pacote apenas-manifesto e forma
    # legitima, nao pacote defeituoso.
    required_for_complete_pack:
      - ground_truth.yaml
      - objectives.yaml
      - injects.yaml
    optional:
      - GM_NOTES.md
      - information_distribution.yaml
      - branches.yaml
      - evidence/
      - media/

# ---------------------------------------------------------------------------
# MANIFESTO — 04 secao 2.
# ---------------------------------------------------------------------------
type: object

required:
  - schema_version
  - pack_id
  - title
  - domain
  - min_engine_version
  - duration_minutes
  - personas
  - required_flags
  - required_rubrics

additionalProperties: false

properties:

  schema_version:
    const: 2

  pack_id:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'

  title:
    type: string
    minLength: 1

  domain:
    type: string
    pattern: '^[a-z][a-z0-9_]*$'

  min_engine_version:
    type: string
    pattern: '^[0-9]+\.[0-9]+$'

  duration_minutes:
    type: integer
    minimum: 1

  # `audience` e `lines` NAO tem conjunto fechado declarado na spec — ela exibe
  # `executivo`, `mista` e `[A, B, ruido]` sem nunca fechar o vocabulario.
  # Fecha-los aqui seria repetir a invencao que as decisoes D5 e D6 desfizeram.
  audience:
    type: string
    minLength: 1

  lines:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1

  personas:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'

  # Pack e validado contra as flags do seu adapter no boot; flag desconhecida
  # impede subida do engine (01 secao 5.4).
  required_flags:
    type: array
    uniqueItems: true
    items:
      type: string
      x-aurora-ref: adapter_flags

  # required_rubrics INCLUI A VERSAO. Rubrica ausente ou em versao diferente
  # impede a carga (04 secao 2).
  required_rubrics:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^[a-z][a-z0-9_]*\.v[0-9]+$'

  # Conjunto fechado por 08 secao 3, o mesmo de `projections` no ground truth.
  evidence_sources:
    type: array
    uniqueItems: true
    items:
      enum: [vpn, identity_audit, database_audit, email, cef, precursor]

  branch_policy:
    $ref: '#/$defs/branch_policy'

  calibration:
    $ref: '#/$defs/calibration'

$defs:

  branch_policy:
    type: object
    required:
      - max_branch_points_per_line
      - max_paths_per_branch
      - reconvergence_required
    additionalProperties: false
    properties:
      max_branch_points_per_line:
        type: integer
        minimum: 0
      # `04` secao 2 exibe o valor 2 num exemplo e nunca declara piso. Um
      # `minimum: 2` seria a mesma invencao que as decisoes D6 e D7 desfizeram:
      # quem desliga ramificacao ja o faz por `max_branch_points_per_line: 0`.
      max_paths_per_branch:
        type: integer
        minimum: 1
      reconvergence_required:
        type: boolean

  calibration:
    type: object
    required: [threshold]
    additionalProperties: false
    properties:
      # Brier maximo para considerar integridade validada (TTIV) — 04 secao 2.
      threshold:
        type: number
        minimum: 0
        maximum: 1

  # -------------------------------------------------------------------------
  # injects.yaml
  # -------------------------------------------------------------------------
  injects_document:
    type: object
    required: [injects]
    additionalProperties: false
    properties:
      injects:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/inject'

  # -------------------------------------------------------------------------
  # INJECT — 04 secao 5.
  #
  # EFEITOS SAO DECLARATIVOS (00 secao 5.2): injects declaram estado desejado,
  # nunca executam acao imperativa. E o que torna rollback e idempotencia
  # possiveis — aplicar o mesmo inject duas vezes produz projecao identica
  # (01 secao 5.4).
  # -------------------------------------------------------------------------
  inject:
    type: object
    required: [id, t_relative, titulo_operacional]
    additionalProperties: false
    properties:

      # ---------------------------------------------------------------------
      # id — decisao D6 da Fase 1.
      #
      # A forma anterior, `^[A-Z][0-9]{2}$`, era invencao minha: teto de 99
      # injects e prefixo de um unico caractere. `ransomware-universidade` tem
      # Linhas A + B + ruido (04 secao 9), e `ruido` nao e uma letra — o inject
      # de ruido nao teria id possivel se o prefixo acompanhasse a linha.
      #
      # O PREFIXO NAO CARREGA SEMANTICA DE LINHA, e isso e deliberado. A linha
      # e `linha`, visivel so ao facilitador. Se a letra do id codificasse a
      # linha, o id vazaria a linha para quem ve a fila — e 03 secao 5.2 exige
      # que o operador nao enxergue que existe Linha B, sob pena de destruir o
      # efeito de triagem sob viés. Ver a pendencia apontada para a Fase 3 em
      # docs/progress/fase_1.md.
      # ---------------------------------------------------------------------
      # SUFIXO DE LETRA ADMITIDO. 04 secao 6 ramifica para `A09B` e `A09C`, que
      # reconvergem em `A12`: e assim que a spec nomeia as variantes de caminho.
      # O padrao anterior, `^[A-Z]+[0-9]+$`, RECUSAVA os ids do exemplo
      # normativo — mesma familia da D6, padrao inventado por mim contra a
      # fonte. B4 desta rodada, achado na releitura campo a campo que a
      # auditoria motivou.
      id:
        type: string
        pattern: '^[A-Z]+[0-9]+[A-Z]*$'
        x-aurora-unique: true

      t_relative:
        type: string
        minLength: 1

      # `titulo_operacional` e o unico rotulo visivel ao operador (04 secao 5).
      titulo_operacional:
        type: string
        minLength: 1

      # `linha` e visivel APENAS ao facilitador.
      linha:
        type: string
        minLength: 1

      titulo:
        type: string
      descricao_facilitador:
        type: string
      texto_para_plateia:
        type: string

      objectives:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          x-aurora-ref: pack_objectives

      # Chave de `effects` deve ser flag declarada no adapter; valor deve
      # respeitar o tipo declarado em state_flags.schema.yaml.
      effects:
        type: object
        minProperties: 1
        propertyNames:
          x-aurora-ref: adapter_flags
        x-aurora-effects-match-flag-types: true

      materializes_facts:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          x-aurora-ref: pack_facts

      # SEQUENCIA DE {source, window} — 04 secao 5 e 08 secao 5, que trazem o
      # mesmo bloco em dois documentos independentes.
      #
      # A forma anterior era `array of string`, invencao minha: o contrato
      # ANTERIOR a reescrita da D4 listava `evidence_release` so como NOME numa
      # lista de `optional_fields`, sem forma nenhuma, e eu inventei uma sem
      # abrir a spec. O exemplo normativo era recusado, e a forma aceita nao
      # conseguia carregar a janela.
      #
      # A janela importa: `evidence.schema.yaml` exige `window` para
      # `delivery_mode: released_by_inject`, e a origem dela e exatamente aqui.
      # B1 da terceira auditoria.
      evidence_release:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/evidence_release_item'

      # SEQUENCIA — 04 secao 5. A forma anterior aceitava UM objeto, e o defeito
      # e anterior a reescrita: o contrato de antes ja declarava
      # `required_fields: [persona, content]`, um mapeamento so. A D4 traduziu o
      # erro com fidelidade em vez de encontra-lo.
      #
      # Com um objeto so, um inject revela para UMA persona, e a assimetria de
      # informacao multi-persona — consequencia normativa 3 de 00 secao 3 — fica
      # inexpressavel num pack de sete personas. B2 da terceira auditoria.
      reveals:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/reveals'

      decision_point:
        $ref: '#/$defs/decision_point'

      media_event:
        $ref: '#/$defs/media_event'

      noise:
        type: boolean

    # OBJETIVO OBRIGATORIO, salvo `noise: true` explicito (00 secao 4). Inject
    # sem objetivo associado e ruido deliberado ou ERRO DE AUTORIA — e a
    # ambiguidade entre os dois que fica recusada aqui.
    if:
      required: [noise]
      properties:
        noise:
          const: true
    else:
      required: [objectives]

  # Item de `evidence_release` — 04 secao 5, 08 secao 5.
  evidence_release_item:
    type: object
    required: [source, window]
    additionalProperties: false
    properties:
      # Mesmo conjunto fechado de `projections` do ground truth e de
      # `evidence_sources` do manifesto (08 secao 3).
      source:
        enum: [vpn, identity_audit, database_audit, email, cef, precursor]
      # OBRIGATORIA. E a janela que o MANIFEST de evidencia exige quando o modo
      # e `released_by_inject`, e este e o unico lugar que a produz.
      window:
        type: string
        minLength: 1

  reveals:
    type: object
    required: [persona, content]
    additionalProperties: false
    properties:
      persona:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
      content:
        type: string
        minLength: 1
      confidence:
        enum: [low, medium, high]

  # -------------------------------------------------------------------------
  # DECISION POINT e CAPABILITY GAP — 04 secoes 5 e 5.1.
  # -------------------------------------------------------------------------
  decision_point:
    type: object
    required: [id, question, options]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
        x-aurora-unique: true
      question:
        type: string
        minLength: 1
      options:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/option'
      objectives:
        type: array
        uniqueItems: true
        items:
          type: string
          x-aurora-ref: pack_objectives
      timer_minutes:
        type: integer
        minimum: 1

  option:
    type: object
    # `effects` e `tradeoff` sao obrigatorios inclusive na opcao que declara
    # lacuna: a lacuna tem consequencia no mundo simulado e NAO E SAIDA SEM
    # CUSTO.
    required: [id, label, effects, tradeoff]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
      label:
        type: string
        minLength: 1
      effects:
        type: object
        propertyNames:
          x-aurora-ref: adapter_flags
        x-aurora-effects-match-flag-types: true
      tradeoff:
        type: string
        minLength: 1
      capability_gap:
        $ref: '#/$defs/capability_gap'

  # `capability_gap` marca que a opcao declara AUSENCIA DE CAPACIDADE, nao
  # escolha de curso de acao.
  #
  # Escolher a opcao emite `decision_made` como qualquer outra, E TAMBEM
  # `capability_gap_declared` — o primeiro preserva a uniformidade da trilha de
  # decisoes, o segundo carrega os campos para a projecao do AAR.
  capability_gap:
    type: object
    required: [control_function]
    additionalProperties: false
    properties:

      # NUNCA nome de produto ou de fornecedor (05 secao 5.1). Lacunas sao
      # nomeadas por FUNCAO DE CONTROLE. Um exercicio em que a resposta certa
      # aponta para um fornecedor deixa de medir a capacidade da equipe e passa
      # a medir se ela adivinhou o vendor.
      #
      # O padrao NAO distingue funcao de controle de nome de produto —
      # `produto_xyz_edr` casa com ele. Quem recusa e revisao humana e o linter
      # da Fase 7, e por isso a regra esta em x-aurora-linter-rules e nao entre
      # os exemplos negativos: declarar ali o que nenhuma camada recusa seria
      # fixture que passa sem provar nada.
      #
      # Vocabulario ABERTO nesta versao do schema (04 secao 5.1). Fecha-lo agora
      # seria inventar taxonomia antes de haver dados.
      control_function:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'

      # Todo objetivo aqui deve existir em objectives.yaml. Mesma classe do
      # event_type inexistente e pelo mesmo motivo: o erro de digitacao nao
      # falha em lugar nenhum, a lacuna simplesmente nao e atribuida a objetivo
      # algum e some do AAR (04 secao 6.2).
      objectives_affected:
        type: array
        uniqueItems: true
        items:
          type: string
          x-aurora-ref: pack_objectives

      metric_impacted:
        $ref: 'https://aurora-cyber-range.local/contracts/objectives.schema.json#/$defs/metric_binding'

  # -------------------------------------------------------------------------
  # branches.yaml — 04 secao 6.
  # -------------------------------------------------------------------------
  branches_document:
    type: object
    required: [branches]
    additionalProperties: false
    properties:
      branches:
        type: array
        items:
          $ref: '#/$defs/branch'

  branch:
    type: object
    # `reconverge_at` obrigatorio: branch sem reconvergencia e recusada
    # (04 secao 6.2).
    required: [id, at_inject, evaluate, reconverge_at]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
        x-aurora-unique: true
      at_inject:
        type: string
        x-aurora-ref: pack_injects
      reconverge_at:
        type: string
        x-aurora-ref: pack_injects
      line:
        type: string
        minLength: 1
      evaluate:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/branch_arm'

  branch_arm:
    type: object
    required: [id, next]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
      next:
        type: string
        x-aurora-ref: pack_injects
      when:
        $ref: '#/$defs/branch_condition'
      default:
        type: boolean
      # 04 secao 6 traz este campo no braco do exemplo normativo. Faltava, e a
      # omissao vinha do contrato anterior — mas la era INOCUA, porque nada
      # fechava o vocabulario. O `additionalProperties: false` da reescrita
      # converteu lacuna silenciosa em RECUSA DE PACK LEGITIMO: fechar um
      # vocabulario transcrito incompletamente transforma cada falha de
      # transcricao em regra que quebra pacote. B3 da terceira auditoria.
      note_to_facilitator:
        type: string
        minLength: 1

  # -------------------------------------------------------------------------
  # CONDICAO DE BRANCH — arvore fechada, 04 secao 6.1.
  #
  # CONDICOES SO PODEM DEPENDER DO OBJETIVAMENTE OBSERVAVEL. Qualquer condicao
  # que dependa de juizo torna o cenario nao ensaiavel e nao determinista — e
  # aqui ela deixa de ser expressavel, em vez de ficar proibida por prosa.
  # -------------------------------------------------------------------------
  branch_condition:
    oneOf:
      - $ref: '#/$defs/branch_all'
      - $ref: '#/$defs/branch_any'
      - $ref: '#/$defs/branch_not'
      - $ref: '#/$defs/branch_event'
      - $ref: '#/$defs/branch_decision'
      - $ref: '#/$defs/branch_option'
      - $ref: '#/$defs/branch_flag'
      - $ref: '#/$defs/branch_before'
      - $ref: '#/$defs/branch_after'

  branch_all:
    type: object
    required: [all]
    additionalProperties: false
    properties:
      all:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/branch_condition'

  branch_any:
    type: object
    required: [any]
    additionalProperties: false
    properties:
      any:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/branch_condition'

  branch_not:
    type: object
    required: [not]
    additionalProperties: false
    properties:
      not:
        $ref: '#/$defs/branch_condition'

  branch_event:
    type: object
    required: [event]
    additionalProperties: false
    properties:
      event:
        type: string
        x-aurora-ref: event_catalog
      payload:
        type: object

  branch_decision:
    type: object
    required: [decision]
    additionalProperties: false
    properties:
      decision:
        type: string
        minLength: 1

  branch_option:
    type: object
    required: [option]
    additionalProperties: false
    properties:
      option:
        type: string
        x-aurora-ref: pack_decision_options

  branch_flag:
    type: object
    required: [flag]
    additionalProperties: false
    properties:
      flag:
        type: string
        x-aurora-ref: adapter_flags
      equals:
        description: 'boolean, number ou string conforme o tipo declarado da flag'

  branch_before:
    type: object
    required: [before]
    additionalProperties: false
    properties:
      before:
        type: string
        minLength: 1

  branch_after:
    type: object
    required: [after]
    additionalProperties: false
    properties:
      after:
        type: string
        minLength: 1

  # -------------------------------------------------------------------------
  # EVENTO DE MIDIA — 04 secao 7.
  # -------------------------------------------------------------------------
  media_event:
    type: object
    required: [type, deadline_minutes, requires_response]
    additionalProperties: false
    properties:
      type:
        enum:
          - press_call
          - investigative
          - viral_post
          - protest
          - union
      deadline_minutes:
        type: integer
        minimum: 1
      requires_response:
        type: boolean
      outlet:
        type: string
      reporter:
        type: string
      objectives:
        type: array
        uniqueItems: true
        items:
          type: string
          x-aurora-ref: pack_objectives

      # Permite ao AAR comparar automaticamente o numero comunicado com o ground
      # truth — a assimetria entre o que foi dito fora e o que de fato ocorreu.
      #
      # O caminho pontuado de 04 secao 7 e a razao de `fact_id` nao poder conter
      # ponto: `facts.GT-A-020.records_affected` deixaria de ser desambiguavel.
      fact_check_against:
        type: string
        pattern: '^facts\.GT-[A-Z0-9]+-[0-9]+\.[a-z][a-z0-9_]*$'

# ---------------------------------------------------------------------------
# Validacao obrigatoria do linter — 04 secao 6.2 e 5.1.
#
# Estas dependem de relacao entre documentos ou de julgamento, e nao sao
# garantia deste arquivo. Obrigacao do `range-cli scenario lint` (Fase 7).
# ---------------------------------------------------------------------------
x-aurora-linter-rules:
  - 'branch_policy do manifesto e aplicada: excesso de pontos de ramificacao ou de caminhos e recusado'
  - 'todo option referenciado deve existir no decision_point indicado'
  - 't_relative fora de ordem e recusado'
  - '`control_function` nomeia funcao de controle, NUNCA produto ou fornecedor (05 secao 5.1) — nao mecanizavel por padrao'
  - 'GM_NOTES.md com fato ausente do ground_truth e recusado (00 secao 5.10)'
  - '`fact_check_against` deve resolver para um campo existente do fato indicado'
  - '`required_rubrics` deve cobrir toda rubrica citada em objectives.yaml'

# ---------------------------------------------------------------------------
# BLOCOS DA SPEC QUE ESTE CONTRATO GOVERNA — ver scripts/check_spec_examples.py.
#
# TRES DOS QUATRO DEFEITOS da terceira auditoria estavam nos blocos abaixo, e
# nenhum exemplo meu os exercitava. Sao eles que passam a ser lidos pela
# maquina em vez de pela minha leitura.
# ---------------------------------------------------------------------------
x-aurora-spec-examples:
  - doc: '04_SCENARIO_SCHEMA.md'
    anchor: '2. Manifesto'
    pointer: ''
    form: document
  - doc: '04_SCENARIO_SCHEMA.md'
    anchor: '5. Inject'
    pointer: '#/$defs/inject'
    form: sequence-item
  - doc: '04_SCENARIO_SCHEMA.md'
    anchor: '6. Branching'
    pointer: '#/$defs/branches_document'
    form: document
  - doc: '04_SCENARIO_SCHEMA.md'
    anchor: '7. Eventos de mídia'
    pointer: '#/$defs/media_event'
    form: 'property: media_event'
  - doc: '08_EVIDENCE_SIMULATOR.md'
    anchor: '5. Modos de entrega'
    pointer: '#/$defs/inject/properties/evidence_release'
    form: 'property: evidence_release'

# ---------------------------------------------------------------------------
# Exemplo POSITIVO — manifesto minimo valido. `pointer` nomeia o ponteiro que
# valida a instancia; ausente significa a raiz.
# ---------------------------------------------------------------------------
examples:
  - schema_version: 2
    pack_id: ransomware-universidade
    title: 'Ransomware na véspera da matrícula'
    domain: academus
    min_engine_version: '1.0'
    duration_minutes: 240
    audience: executivo
    lines: [A, B, ruido]
    personas: [reitoria, ti, dpo, juridico, comunicacao]
    required_flags: [academus.enrollment_offline, academus.lms_session_drop_rate]
    required_rubrics: [incident_triage.v2, crisis_communication.v2]
    evidence_sources: [email, vpn, identity_audit, database_audit]
    branch_policy:
      max_branch_points_per_line: 1
      max_paths_per_branch: 2
      reconvergence_required: true
    calibration:
      threshold: 0.15

x-aurora-document-examples:

  # Os injects que o exemplo de branches referencia existem aqui: os exemplos
  # positivos dos seis contratos formam um mini-pacote coerente, e e contra ele
  # que `at_inject`, `reconverge_at` e `next` resolvem em
  # scripts/check_contract_examples.py. Branch apontando para inject que o
  # exemplo irmao nao declara seria a propria falha que o contrato diz recusar.
  # OS VALORES SAO OS LITERAIS DO EXEMPLO NORMATIVO, nao equivalentes que eu
  # escrevesse. `evidence_release`, `reveals`, o par A09B/A09C e o
  # `note_to_facilitator` abaixo vieram tal e qual de 04 secoes 5 e 6. Se a
  # fixture usa `A09B` e o padrao aceita `A09B`, a correcao esta provada contra
  # a fonte — e nao contra a minha leitura dela, que foi o que falhou nos quatro
  # defeitos desta rodada.
  - pointer: '#/$defs/injects_document'
    instance:
      injects:
        - id: A07
          linha: A
          t_relative: '00:47'
          titulo_operacional: 'Comunicado 07'
          titulo: 'Nota de resgate exibida no portal'
          objectives: [OBJ-03]
          effects:
            academus.portal_defaced: true
          # B1 — literal de 04 secao 5 e 08 secao 5.
          evidence_release:
            - source: vpn
              window: 'T-9d → T-8d'
          # B2 — literal de 04 secao 5, e agora sequencia: duas personas no
          # mesmo inject, que e o que a forma anterior nao expressava.
          reveals:
            - persona: reitoria
              content: 'possível vazamento de dados de alunos'
              confidence: low
            - persona: juridico
              content: 'exposição regulatória em avaliação'
              confidence: medium
        - id: A08
          linha: A
          t_relative: '00:55'
          titulo_operacional: 'Comunicado 08'
          objectives: [OBJ-03]
          # M3 — sem `decision_point` em exemplo nenhum, o registro
          # `pack_decision_options` ficava VAZIO e a folha `option` do branching
          # nao podia disparar corretamente contra nada. Regra que passava por
          # ser inalcancavel. Ids literais de 04 secao 5.
          decision_point:
            id: DP-A03
            question: 'Suspender a matrícula online?'
            objectives: [OBJ-03]
            timer_minutes: 15
            options:
              - id: suspend
                label: 'Suspender imediatamente'
                effects:
                  academus.enrollment_offline: true
                tradeoff: 'Contém exposição; interrompe período letivo, gera fila física'
              - id: monitor
                label: 'Manter no ar sob monitoramento'
                effects:
                  academus.lms_session_drop_rate: 0.6
                tradeoff: 'Preserva calendário; amplia janela de exposição'
        # B4 — as variantes de caminho do exemplo normativo de 04 secao 6. O
        # padrao anterior recusava as duas.
        - id: A09B
          linha: A
          t_relative: '01:10'
          titulo_operacional: 'Comunicado 09B'
          objectives: [OBJ-03]
        - id: A09C
          linha: A
          t_relative: '01:15'
          titulo_operacional: 'Comunicado 09C'
          objectives: [OBJ-03]
        - id: A12
          linha: A
          t_relative: '01:40'
          titulo_operacional: 'Comunicado 12'
          objectives: [OBJ-03]
        # Prefixo diferente sem semântica de linha (D6): ruido nao e uma letra
        # de linha, e o id nao pode revelar qual e.
        - id: R01
          t_relative: '00:52'
          titulo_operacional: 'Comunicado 11'
          noise: true

  # Transcricao literal do exemplo normativo de 04 secao 6, id por id: mesmo
  # `BR-A-CONTAINMENT`, mesmos `A08`/`A09B`/`A09C`/`A12`, mesma condicao e mesmo
  # `note_to_facilitator`. Tres dos quatro defeitos desta rodada estavam neste
  # bloco da spec e nenhum exemplo o exercitava.
  - pointer: '#/$defs/branches_document'
    instance:
      branches:
        - id: BR-A-CONTAINMENT
          line: A
          at_inject: A08
          evaluate:
            - id: contained_early
              when:
                all:
                  - event: vpn_access_revoked
                  - before: '01:30'
              next: A09B
              # B3 — literal de 04 secao 6.
              note_to_facilitator: 'Alcance reduzido; dados já exfiltrados permanecem.'
            - id: not_contained
              default: true
              next: A09C
          reconverge_at: A12

