# Aurora Cyber Range — dependências da aplicação.
#
# Criado na Fase 1 pela pendência P1-6. O projeto não tinha manifesto nenhum:
# `alembic/env.py` importava `alembic` e `sqlalchemy` sem que nada declarasse
# isso, e `import alembic` resolvia para o diretório `alembic/` do próprio
# repositório como namespace package — a biblioteca nunca esteve instalada.
#
# FRONTEIRA QUE ESTE ARQUIVO NÃO ATRAVESSA
#
# Os seis verificadores de invariante de `tools/` continuam **stdlib puro** e
# são invocados pelo CI **sem `pip install`**. É o gate que a Fase 0 construiu
# em dezenove rodadas, e ele não ganha dependência: um gate que depende da
# aplicação que ele julga deixa de ser gate.
#
# `.github/workflows/invariants.yml` mantém os dois jobs stdlib intactos e
# instala isto num job separado, que roda apenas
# `scripts/check_contract_examples.py`.

[project]
name = "aurora-cyber-range"
version = "0.1.0"
description = "Cyber range de exercício de crise institucional"
requires-python = ">=3.12"

# VERSÕES EXATAS, não faixas — `00_MASTER_SPEC.md` §8 ("todas as versões
# pinadas") e `06_ACCEPTANCE_TESTS.md` T15 ("nenhuma dependência não pinada"),
# que vale para TODAS as fases.
#
# A primeira redação usava `>=`, no mesmo commit em que `docker-compose.yml`
# pinava as imagens por digest e explicava por que tag mutável não é pinagem.
# A mesma regra, aplicada de forma inconsistente a dois artefatos do mesmo
# commit. Foi o B2 da segunda auditoria da Fase 1.
#
# O argumento é concreto, não formal: o job `contratos` é o único gate que
# sustenta o item 1 da DoD, e uma versão nova de `jsonschema` que mude
# resolução de `$ref`, avaliação de `oneOf` ou a API de `referencing` mudaria o
# resultado desse gate sem nada aparecer em diff neste repositório.
dependencies = [
    # Valida os contratos de `contracts/` e executa os exemplos positivos e
    # negativos. Decisão D4 da Fase 1: os contratos são JSON Schema 2020-12, e
    # a alternativa era um interpretador escrito à mão — que é a mesma decisão
    # com outro nome.
    "jsonschema==4.26.0",

    # DECLARADO EXPLICITAMENTE, e não herdado por transitividade de
    # `jsonschema`: `scripts/check_contract_examples.py` o importa direto, e é
    # ele quem resolve os `$ref` entre os contratos. Dependência que o código
    # importa e o manifesto não declara é pinagem que não existe.
    "referencing==0.37.0",

    # Migrations. Modelos chegam na Fase 5; aqui o que se resolve é a P1-9,
    # Alembic inicializado em arquivo e nunca executável.
    "alembic==1.19.1",
    "sqlalchemy==2.0.52",

    # Driver do event store. A escolha e da secao 1.3 do checkpoint desta fase,
    # e nao veio por acidente do primeiro que funcionou: `psycopg` 3 traz as
    # faces SINCRONA e ASSINCRONA no mesmo pacote, entao a borda async da Fase 3
    # nao exige um segundo driver ao lado, com um segundo dialeto de SQL.
    #
    # `psycopg2` teria forcado `asyncpg` na Fase 3, e `04_SCENARIO_SCHEMA.md`
    # secao 4 proibe mudar semantica dentro da mesma `schema_version`.
    #
    # O extra `[binary]` evita exigir toolchain de compilacao e libpq no host —
    # o fecho dele esta pinado em constraints.txt.
    "psycopg[binary]==3.2.12",

    # Cliente do Redis, decidido na secao 1.3 do checkpoint da Fase 2 junto do
    # `psycopg`. A Fase 3 e quem o consome: `01` secao 4 poe a projecao de
    # `simulation_state` em Redis, e reconstruir do zero custa 2,874 s em 150 mil
    # eventos — medido, nao estimado.
    #
    # FECHO TRANSITIVO VAZIO em Python 3.12: `async-timeout` so entra abaixo de
    # 3.11.3, e nada mais. Conferido por `pip download`, e por isso
    # `constraints.txt` ganha uma linha so.
    "redis==8.1.0",

    # `05` §3 nomeia a ferramenta com todas as letras: "todos sinteticos,
    # gerados com **Faker pt_BR**". A peca 4 da Fase 5 e o primeiro consumidor —
    # 28 mil alunos e 1.200 professores precisam de nome, e nome inventado a mao
    # em escala vira lista repetida.
    #
    # PINADA POR CAUSA DA T8, e nao so por convencao: `06` T8 exige dataset
    # BYTE-IDENTICO entre duas execucoes com o mesmo `RANDOM_SEED`. `Faker` e
    # deterministico por `seed_instance`, mas o mapa seed -> nome muda entre
    # VERSOES. Com a versao pinada, a promessa de determinismo tem escopo dito;
    # sem ela, o dataset mudaria numa atualizacao silenciosa de dependencia.
    #
    # O fecho dela e `tzdata`, que ja veio pinado com `psycopg[binary]` —
    # conferido com `importlib.metadata.requires`, e nao suposto.
    "Faker==37.11.0",

    # USADO POR UM SCRIPT SO: scripts/check_spec_examples.py, que valida os
    # blocos de exemplo de `docs/spec/` contra os contratos.
    #
    # A spec e escrita por humanos em YAML completo — usa mapeamento em fluxo,
    # que `tools/_common.py::parse_yaml` recusa por construcao. Aquele parser e
    # deliberadamente estrito e le NOSSOS contratos, escritos no subconjunto por
    # regra nossa. Aplica-lo a spec seria exigir que o documento normativo se
    # dobrasse a limitacao da ferramenta.
    "pyyaml==6.0.3",

    # A `academus-api` — `02` secao 7 fixa FastAPI como a stack do adapter, e
    # `scripts/check_api_surface.py` varre a forma decorada dela desde a peca 2.
    #
    # `starlette`, `pydantic` e `anyio` sao FECHO, e estao em constraints.txt.
    "fastapi==0.141.1",

    # Assinatura e verificacao de JWT. O argumento contra escrever HS256 a mao
    # esta no cabecalho de `range-core/api/tokens.py`, e nao e sobre esforco:
    # um verificador proprio que lesse o `alg` do token e confiasse nele
    # aceitaria `alg: none`. `CLAUDE.md` permite criptografia legitima da
    # aplicacao explicitamente.
    #
    # FECHO TRANSITIVO VAZIO, conferido por `pip download`.
    "pyjwt==2.13.0",

    # O SERVIDOR. Ate a Fase 3 `app` era um objeto ASGI sem quem o servisse, e o
    # cabecalho de `domains/academus/api/app.py` dizia isso: "nao ha servidor;
    # subi-lo com uvicorn e da Fase 4". E esta.
    #
    # `websockets` NAO e fecho automatico: `uvicorn` sem extras nao fala
    # WebSocket, e recusa o upgrade com "Unsupported upgrade request". O canal e
    # o item 2 da DoD, entao a implementacao do protocolo e dependencia direta e
    # declarada — e nao o extra `[standard]`, que traria `httptools`,
    # `python-dotenv`, `pyyaml`, `uvloop` e `watchfiles` para resolver um
    # problema que este projeto nao tem.
    "uvicorn==0.52.3",
    "websockets==17.0.1",
]

# DEPENDENCIA DE TESTE, e separada por isso mesmo.
#
# `starlette.testclient.TestClient` fala o protocolo ASGI com a aplicacao de
# verdade, e exige um cliente HTTP. A alternativa seria eu escrever um cliente
# ASGI de brinquedo, que e exatamente o duplo que testa a si mesmo, e a Fase 2
# fechou com zero mocks por decisao registrada.
#
# `httpx2`, E NAO `httpx`: starlette 1.6 emite
# `StarletteDeprecationWarning: Using httpx with starlette.testclient is
# deprecated; install httpx2 instead` — observado ao rodar a suite, nao lido em
# changelog. Pinar o caminho ja depreciado seria escolher, sabendo, o que quebra
# na proxima subida de versao.
#
# Fora de `dependencies` porque o container da Fase 4 nao precisa dele: declarar
# uma dependencia de teste como de execucao e afirmar que ela e necessaria para
# rodar, o que nao e verdade.
[project.optional-dependencies]
test = ["httpx2==2.10.0"]

[build-system]
# VERSAO EXATA, pelo mesmo argumento que vale para as dependencias acima. A
# forma anterior era `setuptools>=68` — faixa, no mesmo arquivo que argumenta por
# que faixa nao e pinagem, e fora do alcance de constraints.txt, que so cobre o
# ambiente de execucao. O backend de build tambem produz o artefato que o job
# `contratos` instala. L2 da quarta auditoria.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `range-core` tem hífen e não é pacote importável por nome. A Fase 1 deixou
# isso declarado e sem resolver, porque a árvore dela era esqueleto: "nada a
# empacotar ainda". A Fase 2 tem o que empacotar, e resolve por MAPEAMENTO.
#
# `package-dir` separa as duas coisas que estavam confundidas: o CAMINHO NO
# DISCO, que `01_ARCHITECTURE.md` §2 normatiza como `range-core/` e que
# `tools/check_core_boundary.py` varre por esse nome, e o NOME DE IMPORT, que
# precisa ser identificador Python válido.
#
# A alternativa era renomear o diretório para `range_core/`, e ela é pior por
# dois motivos: contradiria o layout que a spec fixa — exigindo spec-change para
# agradar ao empacotador — e moveria o alvo do verificador do invariante 1.
# A lista é explícita, e não `packages.find`: com `package-dir` mapeando um
# nome de pacote a um diretório, a descoberta automática enxergaria `state`,
# `clock` e `engine` como pacotes de TOPO, fora de `range_core`.
packages = [
  "range_core",
  "range_core.aar",
  "range_core.api",
  "range_core.clock",
  "range_core.engine",
  "range_core.engine.branching",
  "range_core.engine.loader",
  "range_core.engine.migrations",
  "range_core.events",
  "range_core.evidence",
  "range_core.metrics",
  "range_core.objectives",
  "range_core.rubrics",
  "range_core.state",
  "range_core.telemetry",
  # O core precisa das constantes de `event_type` geradas: literal de catálogo
  # dentro de `range-core/` viola o invariante 2, e `tools/check_contract_literals.py`
  # isenta `contracts/` justamente por ser onde o artefato legítimo vive.
  #
  # Sem esta entrada o import só funciona com o CWD na raiz do repositório —
  # verificado: fora dela, `ModuleNotFoundError`. Passaria em todo teste local e
  # quebraria no container da Fase 4.
  #
  # Não é violação do invariante 1: ele proíbe o core de importar `domains/`.
  # `contracts/` é a fonte canônica compartilhada, e o catálogo de eventos é
  # agnóstico de domínio — os nomes de FLAG, que são de domínio, continuam
  # chegando como dado em `Declarations`, nunca por import.
  "contracts",
  "contracts.generated",
  # O ADAPTER PASSA A SER PRODUTO NA FASE 3, e nao so arvore de repositorio: a
  # `academus-api` e um objeto ASGI que a Fase 4 sobe em container. Sem estas
  # entradas, `domains.academus.api` resolveria pela arvore com o CWD na raiz e
  # sumiria na instalacao — a MESMA assimetria que `package-dir` e
  # `package-data` ja pagaram duas vezes neste arquivo.
  #
  # Nao e violacao do invariante 1, que proibe o CORE de importar `domains/`. A
  # direcao aqui e a inversa e e a esperada: o adapter importa o core.
  "domains",
  "domains.academus",
  "domains.academus.api",
  "domains.academus.evidence_generators",
  "domains.academus.generated",
  "domains.academus.models",
  "domains.academus.panels",
  "domains.academus.seed",
]

[tool.setuptools.package-dir]
range_core = "range-core"

# OS CONTRATOS SAO DADO DE EXECUCAO, e nao so fonte de geracao.
#
# A Fase 1 os tratava como entrada de `tools/` e de `scripts/`, que rodam na
# arvore. A Fase 2 mudou isso: o loader de pack VALIDA contra
# `contracts/scenario.schema.v2.yaml` e le a taxonomia de motivo de rollback de
# `contracts/events.schema.yaml` — em tempo de execucao, no boot do engine.
#
# Sem esta entrada, a instalacao levaria `contracts/generated/*.py` e deixaria
# os `.yaml` para tras. Na arvore e na instalacao editavel nada quebraria, e o
# container da Fase 4 subiria sem os contratos — a mesma assimetria que
# `package-dir` ja pagou uma vez, e que a secao 3.2 do registro da Fase 2
# mediu.
[tool.setuptools.package-data]
contracts = ["*.yaml"]

# A SUPERFICIE DO NUCLEO E A PAGINA DA SALA SAO DADO DE EXECUCAO — Fase 4.
#
# `range_core/api/superficie.py` le `api_surface.yaml` no boot para saber quais
# caminhos sao publicos: e a MESMA declaracao que o gate confere, e nao uma
# segunda lista no codigo. Sem esta entrada, a instalacao levaria os `.py` e
# deixaria o YAML para tras — na arvore e na instalacao editavel nada quebraria,
# e o container subiria com uma superficie vazia, que por falha fechada
# responderia 401 a sala inteira.
#
# `web/dist/<tela>/index.html` sao AS TRES TELAS, servidas por `GET /sala`,
# `GET /plateia` e `GET /console`. A linha dizia `web/*.html` e apontava para a
# pagina crua da peca 4; a peca 6 a substituiu pelo bundle, como a P4-3
# prometia, e a entrada acompanhou.
#
# SAO ARTEFATO DE BUILD, e nao fonte versionada: `dist/` esta no `.gitignore`, e
# quem os produz e `docker compose --profile build run --rm web-build`. A
# consequencia tem dono: **a imagem da peca 7 constroi o cliente ANTES do
# `pip install`**, senao a instalacao leva os `.py` e deixa as telas para tras —
# e `GET /sala` responde 503 no telao da sala, que e o que o 503 de `_tela`
# existe para dizer em voz alta.
range_core = ["*.yaml", "web/dist/*/index.html"]

# `api_surface.yaml` E DADO DE EXECUCAO desde a peca 4, e nao so declaracao lida
# pelo gate: `domains/academus/api/surface.py` o le no boot para saber quais
# papeis cada rota admite. E a decisao que impede a declaracao de divergir do
# codigo — nao ha dois lugares dizendo quem pode ler o que.
#
# `flags.yaml` vem junto pelo mesmo motivo que os contratos vieram na Fase 2: e
# a fonte da qual o adapter entrega `flag_defaults` como dado.
"domains.academus" = ["*.yaml"]
