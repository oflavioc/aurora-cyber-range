# STACK EFEMERA DA AUDITORIA — P2-19.
#
# Autoridade: `docs/progress/fase_2.md`, P2-19, saida (a), decidida pelo
# operador. O auditor emitia veredito sem executar doze testes que PULAM por
# falta de servico — a persistencia, o criterio de reinicio de `06` T3, a
# deteccao de reescrita por cadeia de hash, a contiguidade de `sequence`, os
# dois escritores concorrentes, e a projecao materializada em Redis.
#
# Metade de dois itens de DoD era verificada por LEITURA E CONFIGURACAO, nao por
# execucao. Este arquivo e o que fecha isso: `scripts/start_checkpoint_audit.sh`
# sobe a stack, aplica a migration e exporta as duas variaveis de teste antes de
# chamar o auditor.
#
# POR QUE UM COMPOSE PROPRIO, e nao o `docker-compose.yml` do projeto
# --------------------------------------------------------------------
# O compose do projeto tem VOLUME PERSISTENTE e le a senha do `.env` de quem
# desenvolve. Apontar a auditoria para ele faria a suite TRUNCAR a tabela de
# eventos do banco de desenvolvimento — os testes fazem isso por desenho, e a
# variavel se chama `AURORA_TEST_DATABASE_URL` exatamente para dizer que aquele
# banco e descartavel.
#
# Aqui: sem volume, credencial descartavel que nao sai deste arquivo, e PORTAS
# DIFERENTES (15432 e 16379).
#
# AS PORTAS SAO BAIXAS DE PROPOSITO. A primeira versao usava 55432 e 56379, e
# 56379 caiu dentro de uma faixa de exclusao do Windows — `bind: uma tentativa
# de acesso a um soquete de uma maneira proibida pelas permissoes`. As faixas
# excluidas sao DINAMICAS (mudam a cada boot) e vivem perto do intervalo
# efemero, entao numero alto e escolha fragil. 15432 e 16379 estao bem abaixo
# dele. Achado rodando, nao lendo.
#
# E O PROJETO E `aurora-audit`, fixado no lancador com `-p`. Sem isso, o
# `docker compose` deriva o nome do DIRETORIO — o mesmo do compose do projeto —
# e reconcilia os dois arquivos como se fossem a mesma stack: a primeira
# execucao deste arquivo RECRIOU o `aurora-redis` de desenvolvimento e depois o
# removeu no `down`. Era exatamente o pior caso que as portas separadas
# tentavam evitar, entrando por outra porta.
#
# `05` secao 8 proibe senha trivial REUTILIZAVEL. Esta nao serve para mais nada
# e vive dentro de um container que morre no fim da auditoria — a mesma leitura
# que o job de CI ja aplica.
#
# OS DIGESTS SAO OS MESMOS DO `docker-compose.yml`, e nao por disciplina:
# `scripts/check_pinned_images.py` cruza os tres arquivos e reprova divergencia.
# Este foi o terceiro arquivo a entrar naquela checagem, e ele entrou junto com
# a generalizacao dela — comparar dois de tres seria a P3-1 de novo.

services:

  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: aurora-audit-postgres
    environment:
      POSTGRES_DB: aurora_audit
      POSTGRES_USER: aurora_audit
      POSTGRES_PASSWORD: efemero-da-auditoria
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora_audit -d aurora_audit"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    container_name: aurora-audit-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
