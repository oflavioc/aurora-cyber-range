# Alembic — inicializado na Fase 1.
#
# NON-GOALS da fase: nenhuma migration de negocio. O que a DoD pede e Alembic
# INICIALIZADO, com a fundacao pronta para a Fase 5 escrever o modelo.
#
# A URL nao mora aqui: vem de DATABASE_URL no ambiente, lida por
# alembic/env.py. Credencial em arquivo versionado seria violacao de
# 05_SECURITY_REQUIREMENTS.md secao 6.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
