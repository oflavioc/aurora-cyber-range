name: invariantes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arquitetura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fronteira core/adapter
        run: python tools/check_core_boundary.py

      - name: literais de flag e event_type
        run: python tools/check_contract_literals.py

      - name: objective_ids fora do caminho de emissao
        run: python tools/check_event_envelope.py

      # codegen.py --check NAO escreve: compara o gerado em memoria com o
      # que esta em disco e sai != 0 em divergencia. Um `git diff` aqui seria
      # vacuoso, porque nada e escrito.
      - name: constantes geradas em dia
        run: python tools/codegen.py --check

      # Prova central da Fase 0: um verificador que nunca falhou contra uma
      # violacao plantada nao e verificador, e um script que sai com zero. Os
      # steps acima provam que a arvore esta limpa; este prova que os
      # verificadores ainda enxergam. Sem ele, um commit que enfraqueca um
      # verificador mantem o CI verde indefinidamente.
      #
      # Fica em `arquitetura`, e nao em job proprio, porque branch protection
      # exige exatamente os contexts arquitetura, spec_freeze e seguranca
      # (docs/process/WORKFLOW.md). Um job novo nao seria obrigatorio e
      # poderia falhar sem bloquear o merge — que e o buraco que este step
      # existe para fechar.
      - name: teste negativo dos seis verificadores
        run: python scripts/phase0_negative_tests.py

  spec_freeze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: spec so muda em PR separado marcado spec-change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          SPEC=$(git diff --name-only "$BASE_SHA" HEAD -- docs/spec/ | wc -l)

          # O conjunto CODE segue o texto normativo, que diz "codigo" sem
          # restringir a diretorio: CLAUDE.md secao "A especificacao e imutavel
          # durante a implementacao" e docs/process/WORKFLOW.md:25.
          #
          # O criterio e SER MECANISMO QUE APLICA A SPEC, nao "tudo que nao e
          # docs/spec/". Nao e literalmente "ser executavel": o conjunto sempre
          # incluiu markdown de governanca de agente (.claude/agents/*.md,
          # user-scope/agents/checkpoint-auditor.md), que nao executa nada mas
          # define comportamento.
          #
          # Por isso docs/process/ fica de fora: e documentacao descritiva, e o
          # proprio PR de spec-change costuma precisar toca-la.
          #
          # tools/ entra porque e onde vivem os verificadores que a spec
          # normatiza (01_ARCHITECTURE.md secao 2); .claude/ e .github/ porque
          # sao hooks e CI, o mecanismo que aplica a propria spec; scripts/
          # porque inclui o harness negativo e o launcher de auditoria.
          #
          # user-scope/ entra pelo mesmo criterio: e a FONTE VERSIONADA do
          # checkpoint-auditor e do seu hook readonly_bash.py, que bootstrap.sh
          # copia para ~/.claude/. O argumento de integridade de
          # docs/process/WORKFLOW.md secao "Por que o auditor nao mora no
          # repositorio" protege a copia instalada, nao a fonte — sem esta
          # entrada, o mesmo PR que altera a spec pode enfraquecer o auditor
          # que deveria audita-la.
          #
          # CLAUDE.md entra pelo mesmo criterio, como instancia de topo: e a
          # instrucao permanente carregada em toda sessao, e define autoridade,
          # invariantes e restricoes inegociaveis. Alterar a spec e o documento
          # que diz como obedece-la no mesmo PR e exatamente o acoplamento que
          # esta regra existe para impedir.
          #
          # Consequencia aceita: o CLAUDE.md espelha partes da spec, entao uma
          # mudanca normativa exigira dois PRs — o de spec-change e o que
          # atualiza o CLAUDE.md. Mesmo custo ja aceito para tools/.
          #
          # .gitignore entra porque e mecanismo, nao descricao: e ele que
          # executa 05_SECURITY_REQUIREMENTS.md secao 6 e CLAUDE.md secao
          # "Nunca commitar", e e o objeto exclusivo do item 6 da DoD
          # (ground_truth.yaml e GM_NOTES.md nao podem estar nele). Sem esta
          # entrada, um PR podia alterar 05_SECURITY_REQUIREMENTS.md e, no
          # mesmo commit, remover .env do .gitignore.
          #
          # Com ela, o conjunto de versionados fora de CODE e fora de
          # docs/spec/ fica so com documentacao descritiva: CHANGELOG_V3.md,
          # README.md, docs/ (inclusive BRIEFING.md, process/ e progress/).
          #
          # Dizia README_FIRST.md, arquivo que foi renomeado para
          # docs/process/BOOTSTRAP.md. Comentario que cita arquivo inexistente e
          # a linhagem P10/P15/P22 — documentacao que sobrevive a mudanca e a
          # contradiz —, entao a renomeacao corrige aqui tambem.
          #
          # ':(glob)*.sh' ancora na raiz — bootstrap.sh e finalize_phase0.sh.
          # Sem o magic glob, '*.sh' casaria em qualquer profundidade.
          CODE=$(git diff --name-only "$BASE_SHA" HEAD -- \
            range-core/ domains/ contracts/ \
            tools/ scripts/ .claude/ .github/ user-scope/ \
            CLAUDE.md .gitignore ':(glob)*.sh' | wc -l)

          if [ "$SPEC" -gt 0 ] && [ "$CODE" -gt 0 ]; then
            echo "PR altera spec e codigo no mesmo PR. Separe as mudancas."
            exit 1
          fi

          if [ "$SPEC" -gt 0 ] && ! printf '%s' "$PR_TITLE" | grep -q '^spec-change:'; then
            echo "Alteracao em docs/spec/ exige titulo iniciando com 'spec-change:'"
            exit 1
          fi

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: restricoes de 05_SECURITY_REQUIREMENTS
        run: python tools/check_security_constraints.py

      - name: dados sinteticos em faixa de documentacao
        run: python tools/check_synthetic_data.py

  # ---------------------------------------------------------------------------
  # Job SEPARADO de proposito — pendencia P1-6.
  #
  # E o unico job que instala dependencia. Os jobs `arquitetura` e `seguranca`
  # continuam stdlib puro, sem `pip install`: o gate que a Fase 0 construiu em
  # dezenove rodadas nao ganha dependencia, porque um gate que depende da
  # aplicacao que ele julga deixa de ser gate.
  #
  # SER JOB SEPARADO E SER CONTEXT OBRIGATORIO SAO INDEPENDENTES. Este e o
  # QUARTO required status check de docs/process/WORKFLOW.md, junto com
  # `arquitetura`, `spec_freeze` e `seguranca`. Exigi-lo na branch protection
  # nao faz o `arquitetura` instalar nada.
  #
  # A protecao e aplicada DEPOIS do merge do PR que cria este job: o GitHub so
  # aceita exigir um check que ja apareceu em algum run.
  # ---------------------------------------------------------------------------
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `-c constraints.txt` fixa o FECHO TRANSITIVO, nao so as diretas. Sem
      # ele, `referencing` — que resolve os $ref entre os contratos — e
      # `rpds-py` entrariam em qualquer versao, e o resultado deste gate
      # mudaria sem nada aparecer em diff. B2 da segunda auditoria da Fase 1.
      - name: dependencias da aplicacao, pinadas
        run: python -m pip install --disable-pip-version-check -e . -c constraints.txt

      # Item 1 da DoD da Fase 1. Conter exemplo nao e validar exemplo: aqui os
      # exemplos positivos precisam validar e os negativos precisam ser
      # recusados PELA CAMADA QUE CADA UM DECLARA em `rejected_by`.
      - name: exemplos dos contratos
        run: python scripts/check_contract_examples.py

      # Mesma prova central do harness da Fase 0, aplicada ao executor: um
      # executor de fixtures que nunca reprovou contra defeito plantado prova
      # que a arvore passa, nao que ele pega alguma coisa.
      - name: teste negativo do executor de exemplos
        run: python scripts/check_contract_examples_probes.py

      # A CAMADA QUE FALTAVA. A terceira auditoria mediu o buraco: cinco
      # divergencias entre contrato e spec, e a suite de exemplos encontrou
      # ZERO delas, porque valida cada contrato contra fixtures escritas por
      # quem escreveu o contrato. Aqui a SPEC e a entrada.
      - name: exemplos normativos da spec contra os contratos
        run: python scripts/check_spec_examples.py

      - name: teste negativo do verificador de exemplos da spec
        run: python scripts/check_spec_examples_probes.py

      # P1-9: Alembic estava inicializado em arquivo e nunca executavel —
      # `import alembic` resolvia para o diretorio do proprio repositorio como
      # namespace package. Com a dependencia declarada, isto passa a ser
      # verificavel, e falha se o env.py quebrar.
      - name: alembic executavel
        run: python -m alembic.config --help
