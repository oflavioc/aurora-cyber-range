name: invariantes

# ACTIONS PINADAS POR SHA — P25, herdada da Fase 0 e vencida na Fase 1.
#
# `@v4` e `@v5` sao TAGS MAJOR MUTAVEIS: o conteudo por tras delas muda sem que
# nada apareca em diff neste repositorio. E o mesmo argumento que ja valeu para
# as imagens do compose e para o fecho de dependencias de constraints.txt, e a
# mesma regra — 00_MASTER_SPEC.md secao 8 e 06_ACCEPTANCE_TESTS.md T15.
#
# A tag legivel fica no comentario ao lado de cada SHA, de proposito: o SHA
# sozinho nao diz a humano nenhum qual versao esta rodando. Atualizar passa a
# ser mudanca explicita de commit, que e o que "pinado" significa.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arquitetura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: fronteira core/adapter
        run: python tools/check_core_boundary.py

      - name: literais de flag e event_type
        run: python tools/check_contract_literals.py

      - name: objective_ids fora do caminho de emissao
        run: python tools/check_event_envelope.py

      # codegen.py --check NAO escreve: compara o gerado em memoria com o
      # que esta em disco e sai != 0 em divergencia. Um `git diff` aqui seria
      # vacuoso, porque nada e escrito.
      - name: constantes geradas em dia
        run: python tools/codegen.py --check

      # Prova central da Fase 0: um verificador que nunca falhou contra uma
      # violacao plantada nao e verificador, e um script que sai com zero. Os
      # steps acima provam que a arvore esta limpa; este prova que os
      # verificadores ainda enxergam. Sem ele, um commit que enfraqueca um
      # verificador mantem o CI verde indefinidamente.
      #
      # Fica em `arquitetura`, e nao em job proprio, porque branch protection
      # exige exatamente os contexts arquitetura, spec_freeze e seguranca
      # (docs/process/WORKFLOW.md). Um job novo nao seria obrigatorio e
      # poderia falhar sem bloquear o merge — que e o buraco que este step
      # existe para fechar.
      # A tabela-resumo de pendencias e uma AFIRMACAO DE ESTADO sobre uma secao
      # que pode nao existir — e nao existiu duas vezes, sem que nada acusasse.
      # A secao 1.6 do registro da Fase 1 nomeia a classe; isto e ela virando
      # codigo. Fica aqui, e nao em job proprio, porque job novo e context novo,
      # e context exigido antes de existir em `main` trava todo PR que nao o
      # produza — foi a P1-18.
      - name: registro de fase consistente
        run: python scripts/check_progress_consistency.py

      # P2-2 — a outra metade da garantia de 01 secao 4.1. O fold ja nao
      # consegue consultar o store (nao ha parametro por onde um store entre);
      # aqui se verifica que o store nao consegue OFERECER filtro.
      #
      # Em `scripts/` e nao em `tools/`: 01 secao 2 normatiza SEIS
      # verificadores, e um setimo arquivo ali contradiria a contagem que a spec
      # fixa. Ver a secao 6 do registro da Fase 2.
      - name: superficie de leitura do event store
        run: python scripts/check_store_read_surface.py

      - name: teste negativo da superficie de leitura
        run: python scripts/check_store_read_surface_probes.py

      # P2-15 — o limite que a secao 2.1 do registro da Fase 2 declarou, com o
      # gatilho que ela mesma nomeou: o dia em que o core importasse de
      # `contracts/` algo que nao fosse constante gerada. Disparou no loader.
      #
      # `check_core_boundary.py` so tem opiniao sobre `domains`. Esta checagem
      # nao proibe nada em `contracts/`: ela afirma que o conjunto de imports do
      # core e EXATAMENTE o declarado, com motivo por entrada. Whitelist, pelo
      # mesmo argumento da P2-2 — nenhuma lista de proibicoes preve a proxima
      # palavra.
      - name: imports do core para contracts/
        run: python scripts/check_core_contract_imports.py

      - name: teste negativo dos imports do core
        run: python scripts/check_core_contract_imports_probes.py

      # P37 — o gate `spec_freeze` so enxerga o que esta em SPEC ou em CODE.
      # Diretorio novo no topo nasce invisivel a ele, e nada avisa. Esta
      # checagem exige que todo arquivo versionado esteja classificado, e a
      # terceira classe — DESCRITIVO — e declaracao explicita, com motivo.
      # Fase 3, peca 1. `01` secao 5.4 exige que nenhum servico use flag nao
      # declarada, e o loader recusa boot com flag desconhecida — mas a SPEC nao
      # passava por nenhuma das duas. O item 2 da DoD da Fase 3 citava uma flag
      # que o adapter nao tinha: insatisfazivel por construcao, e invisivel
      # porque `check_spec_examples.py` valida blocos YAML e a DoD e markdown.
      - name: flags citadas na spec existem no adapter
        run: python scripts/check_spec_flags.py

      - name: teste negativo das flags citadas na spec
        run: python scripts/check_spec_flags_probes.py

      # Fase 3, peca 2. A superficie da API e declarada ANTES de a rota
      # existir, e a checagem cobra IGUALDADE nas duas direcoes — em especial
      # rota implementada e nao declarada, que e a direcao sem a qual a lista
      # vira documentacao com sintaxe de verificador.
      # Fase 3, peca 3. A projecao materializada cria a tentacao de um caminho
      # de escrita de estado que nao passa pelo fold — e `01` secao 4.1 diz que
      # o que nao vem do fold nao sobrevive a reconstrucao.
      - name: o fold e a unica autoridade de estado
        run: python scripts/check_fold_authority.py

      - name: teste negativo da autoridade do fold
        run: python scripts/check_fold_authority_probes.py

      - name: superficie da api x rotas implementadas
        run: python scripts/check_api_surface.py

      - name: teste negativo da superficie da api
        run: python scripts/check_api_surface_probes.py

      # O CLIENTE PINTA O PAYLOAD — Fase 4, peca 6. A D17 poe o corte de telao no
      # servidor e o orcamento virou teste; um `.sort()` no TypeScript troca
      # quais tres aparecem e o teste de orcamento continua VERDE, porque ele
      # mede o payload. Stdlib pura, entao roda neste job.
      - name: o cliente nao deriva o que a projecao ja cortou
        run: python scripts/check_web_sem_derivacao.py

      - name: teste negativo do verificador do cliente
        run: python scripts/check_web_sem_derivacao_probes.py

      # P3-1. Na peca 3 eu inventei o digest do Redis para o servico deste
      # workflow, com o `docker-compose.yml` ja pinando o valor ao lado. Foi
      # pego por `grep`, e nao por mecanismo — entao na rodada seguinte poderia
      # nao ser pego. Digest inventado ou quebra o job, ou resolve para OUTRA
      # imagem, e o segundo caso aparece como teste instavel longe da causa.
      - name: imagens pinadas por digest, e iguais nos dois lugares
        run: python scripts/check_pinned_images.py

      - name: teste negativo das imagens pinadas
        run: python scripts/check_pinned_images_probes.py

      - name: cobertura do gate spec_freeze
        run: python scripts/check_gate_coverage.py

      - name: teste negativo da cobertura do gate
        run: python scripts/check_gate_coverage_probes.py

      # Sete eixos da guarda de base do lancador (P3-7). So os PROBES rodam no
      # CI: `check_audit_base.py` julga a topologia entre a branch da fase e
      # `main`, que e uma pergunta do LANCADOR e nao do PR — roda-lo aqui
      # reprovaria todo PR de fase ja mergeada, que e o caso normal de um push
      # para `main`. O que o CI tem de garantir e que o predicado continua
      # sabendo recusar, e isso e o que os probes provam.
      - name: teste negativo da guarda de base da auditoria
        run: python scripts/check_audit_base_probes.py

      - name: teste negativo dos seis verificadores
        run: python scripts/phase0_negative_tests.py

  spec_freeze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: spec so muda em PR separado marcado spec-change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # SPEC inclui `docs/process/PHASE_0_CHECKLIST.md`, e a razao e a
          # NATUREZA do arquivo, nao a pasta em que ele mora: ele e uma
          # DEFINITION OF DONE, do mesmo tipo que as de
          # 07_IMPLEMENTATION_PHASES.md. Auditorias o citam como "requisito
          # violado", e docs/process/WORKFLOW.md se apoia nele.
          #
          # Fora daqui ele estava em conjunto NENHUM — nem SPEC nem CODE —, e
          # podia ser alterado no mesmo PR que altera o mecanismo que ele julga.
          # Era a P37, e a pendencia so via metade dela.
          SPEC=$(git diff --name-only "$BASE_SHA" HEAD -- \
            docs/spec/ docs/process/PHASE_0_CHECKLIST.md | wc -l)

          # O conjunto CODE segue o texto normativo, que diz "codigo" sem
          # restringir a diretorio: CLAUDE.md secao "A especificacao e imutavel
          # durante a implementacao" e docs/process/WORKFLOW.md:25.
          #
          # O criterio e SER MECANISMO QUE APLICA A SPEC, nao "tudo que nao e
          # docs/spec/". Nao e literalmente "ser executavel": o conjunto sempre
          # incluiu markdown de governanca de agente (.claude/agents/*.md,
          # user-scope/agents/checkpoint-auditor.md), que nao executa nada mas
          # define comportamento.
          #
          # Por isso docs/process/ fica de fora: e documentacao descritiva, e o
          # proprio PR de spec-change costuma precisar toca-la.
          #
          # tools/ entra porque e onde vivem os verificadores que a spec
          # normatiza (01_ARCHITECTURE.md secao 2); .claude/ e .github/ porque
          # sao hooks e CI, o mecanismo que aplica a propria spec; scripts/
          # porque inclui o harness negativo e o launcher de auditoria.
          #
          # user-scope/ entra pelo mesmo criterio: e a FONTE VERSIONADA do
          # checkpoint-auditor e do seu hook readonly_bash.py, que bootstrap.sh
          # copia para ~/.claude/. O argumento de integridade de
          # docs/process/WORKFLOW.md secao "Por que o auditor nao mora no
          # repositorio" protege a copia instalada, nao a fonte — sem esta
          # entrada, o mesmo PR que altera a spec pode enfraquecer o auditor
          # que deveria audita-la.
          #
          # CLAUDE.md entra pelo mesmo criterio, como instancia de topo: e a
          # instrucao permanente carregada em toda sessao, e define autoridade,
          # invariantes e restricoes inegociaveis. Alterar a spec e o documento
          # que diz como obedece-la no mesmo PR e exatamente o acoplamento que
          # esta regra existe para impedir.
          #
          # Consequencia aceita: o CLAUDE.md espelha partes da spec, entao uma
          # mudanca normativa exigira dois PRs — o de spec-change e o que
          # atualiza o CLAUDE.md. Mesmo custo ja aceito para tools/.
          #
          # .gitignore entra porque e mecanismo, nao descricao: e ele que
          # executa 05_SECURITY_REQUIREMENTS.md secao 6 e CLAUDE.md secao
          # "Nunca commitar", e e o objeto exclusivo do item 6 da DoD
          # (ground_truth.yaml e GM_NOTES.md nao podem estar nele). Sem esta
          # entrada, um PR podia alterar 05_SECURITY_REQUIREMENTS.md e, no
          # mesmo commit, remover .env do .gitignore.
          #
          # Com ela, o conjunto de versionados fora de CODE e fora de
          # docs/spec/ fica so com documentacao descritiva: CHANGELOG_V3.md,
          # README.md, docs/ (inclusive BRIEFING.md, process/ e progress/).
          #
          # Dizia README_FIRST.md, arquivo que foi renomeado para
          # docs/process/BOOTSTRAP.md. Comentario que cita arquivo inexistente e
          # a linhagem P10/P15/P22 — documentacao que sobrevive a mudanca e a
          # contradiz —, entao a renomeacao corrige aqui tambem.
          #
          # ':(glob)*.sh' ancora na raiz — bootstrap.sh e finalize_phase0.sh.
          # Sem o magic glob, '*.sh' casaria em qualquer profundidade.
          #
          # `docs/process/` ENTRA, menos o checklist que subiu para SPEC. Ele
          # descreve o fluxo de auditoria, o guarda de branch e os quatro
          # contexts obrigatorios — governanca de mecanismo, mesmo criterio que
          # ja pos `.claude/` e `user-scope/` aqui. Sem ele, um PR de
          # spec-change podia enfraquecer o processo que julga spec-change.
          #
          # O comentario anterior justificava a exclusao dizendo que "o proprio
          # PR de spec-change costuma precisar toca-la". MEDIDO: dos treze
          # spec-change do repositorio, UM tocou `docs/process/` — e o que ele
          # tocou foi o `PHASE_0_CHECKLIST.md`, que agora e SPEC. A
          # justificativa descrevia exatamente o caso que esta linha separa.
          CODE=$(git diff --name-only "$BASE_SHA" HEAD -- \
            range-core/ domains/ contracts/ \
            tools/ scripts/ .claude/ .github/ user-scope/ \
            docs/process/ ':(exclude)docs/process/PHASE_0_CHECKLIST.md' \
            CLAUDE.md .gitignore ':(glob)*.sh' | wc -l)

          if [ "$SPEC" -gt 0 ] && [ "$CODE" -gt 0 ]; then
            echo "PR altera spec e codigo no mesmo PR. Separe as mudancas."
            exit 1
          fi

          if [ "$SPEC" -gt 0 ] && ! printf '%s' "$PR_TITLE" | grep -q '^spec-change:'; then
            echo "Alteracao em docs/spec/ exige titulo iniciando com 'spec-change:'"
            exit 1
          fi

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: restricoes de 05_SECURITY_REQUIREMENTS
        run: python tools/check_security_constraints.py

      - name: dados sinteticos em faixa de documentacao
        run: python tools/check_synthetic_data.py

  # ---------------------------------------------------------------------------
  # Job SEPARADO de proposito — pendencia P1-6.
  #
  # E o unico job que instala dependencia. Os jobs `arquitetura` e `seguranca`
  # continuam stdlib puro, sem `pip install`: o gate que a Fase 0 construiu em
  # dezenove rodadas nao ganha dependencia, porque um gate que depende da
  # aplicacao que ele julga deixa de ser gate.
  #
  # SER JOB SEPARADO E SER CONTEXT OBRIGATORIO SAO INDEPENDENTES. Este e o
  # QUARTO required status check de docs/process/WORKFLOW.md, junto com
  # `arquitetura`, `spec_freeze` e `seguranca`. Exigi-lo na branch protection
  # nao faz o `arquitetura` instalar nada.
  #
  # A protecao e aplicada DEPOIS do merge do PR que cria este job: o GitHub so
  # aceita exigir um check que ja apareceu em algum run.
  # ---------------------------------------------------------------------------
  contratos:
    runs-on: ubuntu-latest

    # POSTGRES DE SERVICO, e nao o compose do projeto. As credenciais aqui sao
    # descartaveis e vivem dentro do job — 05 secao 8 proibe senha trivial
    # REUTILIZAVEL, e esta nao sai daqui nem serve para mais nada.
    #
    # Servico nao cria context novo na branch protection, entao a P1-18 nao se
    # aplica: e o mesmo job `contratos`, com uma dependencia a mais.
    #
    # Imagem pinada por digest, igual ao docker-compose.yml: tag e rotulo
    # mutavel, e "pinado" em 00 secao 8 quer dizer conteudo imutavel.
    services:
      # Redis de servico, com O MESMO DIGEST do `docker-compose.yml`. Tag e
      # rotulo mutavel, e "pinado" em `00` secao 8 quer dizer conteudo imutavel —
      # mas dois digests DIFERENTES para o mesmo papel seriam dois ambientes,
      # e o CI deixaria de julgar o que o desenvolvedor roda.
      #
      # A primeira versao desta linha trazia um digest INVENTADO. Nao e detalhe:
      # digest inventado ou nao existe, e o job quebra com erro de imagem, ou
      # existe e aponta para outra coisa. O compose ja tinha o valor, e era so
      # ler — a secao 1.5 da Fase 1 outra vez, com o custo baixo desta vez.
      #
      # Sem este servico os testes da projecao materializada PULAM, e pulo
      # silencioso lido como verde e o que a P2-19 ataca.
      redis:
        image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_DB: aurora_test
          POSTGRES_USER: aurora_test
          POSTGRES_PASSWORD: efemero-do-job-de-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora_test -d aurora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # A migration le `DATABASE_URL`; os testes leem
      # `AURORA_TEST_DATABASE_URL`. Sao DUAS variaveis de proposito: a segunda
      # declara que aquele banco e descartavel, e os testes TRUNCAM a tabela.
      # Apontar os testes para `DATABASE_URL` faria um `unittest` distraido
      # apagar o banco de desenvolvimento de quem tivesse o `.env` carregado.
      DATABASE_URL: postgresql+psycopg://aurora_test:efemero-do-job-de-ci@127.0.0.1:5432/aurora_test
      AURORA_TEST_DATABASE_URL: postgresql+psycopg://aurora_test:efemero-do-job-de-ci@127.0.0.1:5432/aurora_test
      # Variavel PROPRIA, pelo mesmo motivo da de Postgres: estes testes ESCREVEM
      # e APAGAM a chave da projecao. Apontar para `REDIS_URL` faria um
      # `unittest` distraido limpar a projecao de quem tivesse o `.env` carregado.
      AURORA_TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # `-c constraints.txt` fixa o FECHO TRANSITIVO, nao so as diretas. Sem
      # ele, `referencing` — que resolve os $ref entre os contratos — e
      # `rpds-py` entrariam em qualquer versao, e o resultado deste gate
      # mudaria sem nada aparecer em diff. B2 da segunda auditoria da Fase 1.
      # `.[test]` traz `httpx2`, que `starlette.testclient` exige para falar
      # ASGI com a `academus-api` de verdade. Ele fica FORA de `dependencies`
      # porque o container da Fase 4 nao precisa dele — declarar dependencia de
      # teste como de execucao e afirmar que ela e necessaria para rodar.
      - name: dependencias da aplicacao, pinadas
        run: python -m pip install --disable-pip-version-check -e ".[test]" -c constraints.txt

      # Item 1 da DoD da Fase 1. Conter exemplo nao e validar exemplo: aqui os
      # exemplos positivos precisam validar e os negativos precisam ser
      # recusados PELA CAMADA QUE CADA UM DECLARA em `rejected_by`.
      - name: exemplos dos contratos
        run: python scripts/check_contract_examples.py

      # Mesma prova central do harness da Fase 0, aplicada ao executor: um
      # executor de fixtures que nunca reprovou contra defeito plantado prova
      # que a arvore passa, nao que ele pega alguma coisa.
      - name: teste negativo do executor de exemplos
        run: python scripts/check_contract_examples_probes.py

      # A CAMADA QUE FALTAVA. A terceira auditoria mediu o buraco: cinco
      # divergencias entre contrato e spec, e a suite de exemplos encontrou
      # ZERO delas, porque valida cada contrato contra fixtures escritas por
      # quem escreveu o contrato. Aqui a SPEC e a entrada.
      - name: exemplos normativos da spec contra os contratos
        run: python scripts/check_spec_examples.py

      - name: teste negativo do verificador de exemplos da spec
        run: python scripts/check_spec_examples_probes.py

      # P1-9: Alembic estava inicializado em arquivo e nunca executavel —
      # `import alembic` resolvia para o diretorio do proprio repositorio como
      # namespace package. Com a dependencia declarada, isto passa a ser
      # verificavel, e falha se o env.py quebrar.
      - name: alembic executavel
        run: python -m alembic.config --help

      # A migration da Fase 2 roda contra o servico. Sem este passo os testes de
      # Postgres PULARIAM por tabela ausente em vez de por banco ausente — e
      # pulo por motivo errado e verde que mente.
      - name: migrations aplicadas
        run: python -m alembic upgrade head

      # ESTE JOB SE CHAMA `contratos` E PASSA A RODAR TESTE DE CODIGO. O nome
      # deixa de descrever o escopo, e o desvio e deliberado: job novo e context
      # novo, e context exigido antes de existir em `main` trava todo PR que nao
      # o produza — foi a P1-18. O encaixe aqui nao cria context, e o job ja
      # instala a aplicacao, que os testes exigem.
      #
      # CONDICAO DE SAIDA, registrada em docs/progress/fase_2.md secao 3.3:
      # renomear quando houver outro motivo para tocar na branch protection.
      - name: testes do range-core
        run: python -m unittest discover -s tests

      # O DEMO da Fase 2, rodado como passo de CI.
      #
      # `07_IMPLEMENTATION_PHASES.md` da a cada fase um DEMO SCRIPT, e ate aqui
      # "o demo roda" era atestacao — alguem rodava uma vez e o registro dizia
      # que rodou. Roteiro de demonstracao que ninguem executa apodrece igual a
      # comentario que ninguem le, e a Fase 1 ja pagou por um DEMO que era
      # inexecutavel havia tempo sem que nada acusasse.
      #
      # Nao usa banco: `InMemoryEventStore` basta para a sequencia. O que ele
      # prova alem dos testes e a MONTAGEM — contratos lidos do disco, flags do
      # adapter entregues como dado, pack do fixture, clock, store e engine
      # ligados na ordem em que um chamador real os liga.
      - name: DEMO da fase executavel
        run: python scripts/demo_fase2.py

      # A suite acima roda na RAIZ, e ali `contracts` resolve pela ARVORE mesmo
      # sem instalacao — verificado com `python -S`. Sem este passo, a entrada
      # `contracts` de `package-dir` ficaria SEM PROVA, e ela existe justamente
      # para o caso em que o CWD nao e a raiz: o container da Fase 4.
      #
      # `range_core` nao precisa disto — o hifen em `range-core/` ja o impede de
      # resolver pela arvore, entao o import dele na suite ja prova a instalacao.
      # A assimetria e o ponto: cobrir os dois com o mesmo passo seria supor que
      # eles falham do mesmo jeito.
      # A leitura dos contratos entrou aqui na Fase 2, e nao e a mesma prova que
      # o import: o loader passou a ler os `.yaml` de `contracts/` em tempo de
      # execucao, e `read_contracts` resolve o diretorio pelo `__path__` do
      # pacote justamente porque caminho relativo ao arquivo quebraria fora da
      # arvore. Sem este passo, a entrada `package-data` do `pyproject.toml`
      # ficaria sem prova — e o sintoma so apareceria no container.
      #
      # A TERCEIRA LINHA e da peca 4, e prova uma coisa mais estreita que as
      # outras duas: que `api_surface.yaml` e achado pelo `__path__` do pacote e
      # nao pelo CWD. Com instalacao EDITAVEL o `.pth` poe a raiz no `sys.path`,
      # entao ela nao prova o `package-data` — isso so o container prova. O que
      # ela pega e o erro que eu quase cometi: resolver o caminho por
      # `Path.cwd()` ou por `Path(__file__)` relativo, que passa aqui e falha la.
      - name: pacotes importaveis fora da raiz do repositorio
        working-directory: /tmp
        run: |
          python -c "import range_core.state.simulation_state, contracts.generated.events"
          python -c "from range_core.engine.loader import contract_source; assert len(contract_source.read_contracts()) == 6"
          python -c "from domains.academus.api.surface import carregar; assert carregar().rota('GET', '/students/{student_id}').papeis"
