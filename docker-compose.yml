# Aurora Cyber Range — infraestrutura local da Fase 1.
#
# NON-GOALS da fase: nenhuma logica de negocio, nenhuma tela, nenhum seed.
# Este compose sobe apenas Postgres e Redis, que e o que a DoD exige.
#
# 05_SECURITY_REQUIREMENTS.md secao 6: bind em 127.0.0.1, nenhuma porta
# publicada diretamente. As portas abaixo estao explicitamente amarradas ao
# loopback — `5432:5432` publicaria na interface externa.
#
# 00_MASTER_SPEC.md secao 8: todas as versoes pinadas. Tags de imagem incluem
# o digest para que "16" nao mude de conteudo sob os pes.
#
# ATE A PENDENCIA P1-8 ESTE COMENTARIO ERA FALSO: as tags eram
# `postgres:16.4-alpine` e `redis:7.4.1-alpine`, sem digest. Tag pinada em patch
# e bem mais forte que `16`, mas continua mutavel — a mesma tag pode ser
# republicada com outro conteudo, e "pinado" em 00 secao 8 significa conteudo
# imutavel, nao rotulo estavel.
#
# CONSEQUENCIA DE POLITICA, aceita ao pinar: atualizar imagem passa a ser
# MUDANCA EXPLICITA DE COMMIT. `docker compose pull` nao traz versao nova
# sozinho; subir de patch exige editar o digest aqui, e isso aparece em diff e
# em revisao. E o que "pinado" quer dizer.
#
# A tag legivel fica junto do digest de proposito: o digest sozinho nao diz a
# humano nenhum qual versao esta rodando. O digest e que manda — se os dois
# divergirem, o Docker usa o digest.

services:

  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      # Sem default: senha trivial reutilizavel e proibida por 05 secao 8.
      # Ausente, o compose falha em vez de subir com valor previsivel.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aurora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurora} -d ${POSTGRES_DB:-aurora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    container_name: aurora-redis
    restart: unless-stopped
    # Redis guarda a PROJECAO de simulation_state (01 secao 4), que e
    # reconstruivel do event store. Persistencia desligada de proposito: se o
    # Redis cair, a projecao volta do store, e ter duas fontes de verdade para
    # o mesmo estado seria pior que ter uma.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # O TOOLCHAIN DO CLIENTE, EM CONTAINER PINADO — Fase 4, peca 6.
  #
  # POR QUE CONTAINER, E NAO `node` NO HOST
  # ----------------------------------------
  # Nao ha `node` nem `npm` nesta maquina, e instalar no host resolveria UMA
  # maquina: o CI continuaria com a versao que o runner tiver, e passariam a
  # existir duas versoes possiveis do toolchain sem nada garantindo que sao a
  # mesma. Com a imagem pinada por digest, o build que roda aqui e o MESMO que
  # roda no CI, e o toolchain entra sob a regra de `00` secao 8 / `06` T15 como
  # qualquer outra dependencia — `scripts/check_pinned_images.py` ja cobra
  # digest e igualdade entre este arquivo e o workflow.
  #
  # `profiles` mantem o servico FORA do `docker compose up`: ele nao e parte da
  # stack, e sim uma ferramenta que roda e sai.
  #
  #     docker compose --profile build run --rm web-build
  #
  # O comando e a PROVA NEGATIVA do proprio gate, e nao `npm run build` — ver o
  # cabecalho de `range-core/web/prova_do_build.sh`: `vite build` sai 0 com o
  # TypeScript quebrado, e um gate que nunca foi visto reprovando e atestacao.
  # -------------------------------------------------------------------------
  web-build:
    profiles: ["build"]
    image: node:22.11.0-alpine@sha256:b64ced2e7cd0a4816699fe308ce6e8a08ccba463c757c00c14cd372e3d2c763e
    working_dir: /web
    volumes:
      - ./range-core/web:/web
    command: ["sh", "prova_do_build.sh"]

volumes:
  aurora_pgdata:
    name: aurora_pgdata
