# Aurora Cyber Range — infraestrutura local da Fase 1.
#
# NON-GOALS da fase: nenhuma logica de negocio, nenhuma tela, nenhum seed.
# Este compose sobe apenas Postgres e Redis, que e o que a DoD exige.
#
# 05_SECURITY_REQUIREMENTS.md secao 6: bind em 127.0.0.1, nenhuma porta
# publicada diretamente. As portas abaixo estao explicitamente amarradas ao
# loopback — `5432:5432` publicaria na interface externa.
#
# 00_MASTER_SPEC.md secao 8: todas as versoes pinadas. Tags de imagem incluem
# o digest para que "16" nao mude de conteudo sob os pes.
#
# ATE A PENDENCIA P1-8 ESTE COMENTARIO ERA FALSO: as tags eram
# `postgres:16.4-alpine` e `redis:7.4.1-alpine`, sem digest. Tag pinada em patch
# e bem mais forte que `16`, mas continua mutavel — a mesma tag pode ser
# republicada com outro conteudo, e "pinado" em 00 secao 8 significa conteudo
# imutavel, nao rotulo estavel.
#
# CONSEQUENCIA DE POLITICA, aceita ao pinar: atualizar imagem passa a ser
# MUDANCA EXPLICITA DE COMMIT. `docker compose pull` nao traz versao nova
# sozinho; subir de patch exige editar o digest aqui, e isso aparece em diff e
# em revisao. E o que "pinado" quer dizer.
#
# A tag legivel fica junto do digest de proposito: o digest sozinho nao diz a
# humano nenhum qual versao esta rodando. O digest e que manda — se os dois
# divergirem, o Docker usa o digest.

# O PREFIXO DE NOME E O NOME DO VOLUME SAO VARIAVEIS — P4-10, e o argumento e o
# mesmo que ja escolheu `${AURORA_PG_PORT:-5432}` logo abaixo: duas coisas com o
# mesmo nome derrubam o `docker compose up` inteiro.
#
# `container_name` e GLOBAL NO DAEMON: `-p outro-projeto` nao basta, porque o
# nome nao passa pelo projeto. E `volumes.name` fixo faria uma segunda stack
# escrever no `aurora_pgdata` de quem desenvolve — que e exatamente o que o
# `docker-compose.audit.yml` existe para nao fazer.
#
# Os defaults sao os de sempre, entao `docker compose up` continua identico. Quem
# os troca e `scripts/grava_provas_de_container.py`, que roda o DEMO e a prova de
# reinicio DESTE arquivo, a partir do worktree auditado, com a stack de
# desenvolvimento possivelmente no ar ao lado.
#
# A PROVA RODA CONTRA ESTE COMPOSE, e nao contra uma copia dele. Um segundo
# arquivo descrevendo os mesmos servicos seria duas declaracoes do mesmo fato, e
# a que diverge em silencio e sempre a que ninguem esta olhando.

services:

  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: ${AURORA_STACK_PREFIX:-aurora}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      # Sem default: senha trivial reutilizavel e proibida por 05 secao 8.
      # Ausente, o compose falha em vez de subir com valor previsivel.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # A PORTA DO HOST E VARIAVEL, e a do container nao. O CI ja sobe um
      # Postgres de `services:` do runner em 5432 para a suite; a stack de
      # containers da peca 7 sobe ao lado dela, e duas coisas na mesma porta do
      # host derrubam o `docker compose up` inteiro. O default e o de sempre.
      - "127.0.0.1:${AURORA_PG_PORT:-5432}:5432"
    volumes:
      - aurora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurora} -d ${POSTGRES_DB:-aurora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    container_name: ${AURORA_STACK_PREFIX:-aurora}-redis
    restart: unless-stopped
    # Redis guarda a PROJECAO de simulation_state (01 secao 4), que e
    # reconstruivel do event store. Persistencia desligada de proposito: se o
    # Redis cair, a projecao volta do store, e ter duas fontes de verdade para
    # o mesmo estado seria pior que ter uma.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${AURORA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # O ESQUEMA, ANTES DOS PROCESSOS — peca 7.
  #
  # Servico de UMA VEZ: sobe, roda `alembic upgrade head`, sai. As duas APIs
  # dependem dele por `service_completed_successfully`, entao `docker compose
  # up` e auto-suficiente — uma API sobre um banco sem tabela produziria erro no
  # primeiro request, durante a sala.
  #
  # NAO usa `image:`, e sim `build:`: `image:` aqui seria o nome da imagem
  # CONSTRUIDA, e `scripts/check_pinned_images.py` cobraria digest de uma coisa
  # que nao e puxada de registro nenhum. As imagens-base pinadas estao no
  # `Dockerfile`, e o gate as le de la.
  # -------------------------------------------------------------------------
  migrations:
    build:
      context: .
    container_name: ${AURORA_STACK_PREFIX:-aurora}-migrations
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aurora}
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # O `range-api` — o container do item 4 da DoD.
  #
  # `05` §6 pede bind em `127.0.0.1`, e o `AURORA_BIND_HOST` daqui e `0.0.0.0`.
  # NAO E FLEXIBILIZACAO, e a D21 do registro tem o argumento inteiro: dentro do
  # namespace de rede do container, `127.0.0.1` e o loopback DO CONTAINER —
  # ninguem o alcanca, nem o container vizinho. A fronteira que `05` §6 nomeia e
  # a do HOST, e ela esta na linha `ports` logo abaixo: `127.0.0.1:8000:8000`
  # publica no loopback da maquina, e em mais lugar nenhum. O default da IMAGEM
  # e o fechado; quem abre e este arquivo, ao lado de onde a porta aparece.
  #
  # AS VARIAVEIS DE SEGREDO NAO USAM `:?`, e a assimetria com `POSTGRES_PASSWORD`
  # e deliberada: a recusa alta delas ja existe NO PROCESSO e tem teste —
  # `credencial_do_console` exige 16 caracteres, `jwt_secret` e `random_seed`
  # levantam na ausencia. Repetir a exigencia aqui poria todo comando de compose
  # refem de variaveis que ele nao usa: `docker compose run web-build` — que so
  # constroi o cliente — abortaria por falta da senha do console.
  # -------------------------------------------------------------------------
  range-api:
    build:
      context: .
    container_name: ${AURORA_STACK_PREFIX:-aurora}-range-api
    command:
      - python
      - -m
      - uvicorn
      - range_core.api.processo:criar
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      AURORA_BIND_HOST: "0.0.0.0"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aurora}
      REDIS_URL: redis://redis:6379/0
      # O PACK POR VOLUME, e nao por imagem — D13 e `01` §6 (seletor de pack no
      # console). Trocar de cenario nao pode exigir reconstruir a imagem.
      AURORA_PACK: /pack
      # O `flags.yaml` do adapter, como CAMINHO. O core nao importa `domains/`
      # (invariante 1), entao o dominio chega por configuracao — e a mesma
      # imagem serve outro adapter sem uma linha de core mudar.
      AURORA_FLAGS: /app/domains/academus/flags.yaml
      AURORA_GM_PASSWORD: ${AURORA_GM_PASSWORD}
      AURORA_JWT_SECRET: ${AURORA_JWT_SECRET}
    volumes:
      - ./.aurora-pack:/pack:ro
    ports:
      - "127.0.0.1:${AURORA_RANGE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      # A projecao de verdade, e nao um TCP connect: ela atravessa Postgres,
      # Redis e o fold. Um processo que subisse com o banco fora do ar
      # responderia ao connect e falharia aqui, que e a diferenca entre "a porta
      # abriu" e "o exercicio esta servivel".
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/wallboard/state').read()
      interval: 5s
      timeout: 5s
      retries: 12

  # -------------------------------------------------------------------------
  # A `academus-api` — quem DEGRADA no DEMO. Mesma imagem, outra raiz de
  # composicao.
  # -------------------------------------------------------------------------
  academus-api:
    build:
      context: .
    container_name: ${AURORA_STACK_PREFIX:-aurora}-academus-api
    command:
      - python
      - -m
      - uvicorn
      - domains.academus.api.processo:criar
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      AURORA_BIND_HOST: "0.0.0.0"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aurora}
      REDIS_URL: redis://redis:6379/0
      AURORA_PACK: /pack
      AURORA_FLAGS: /app/domains/academus/flags.yaml
      AURORA_JWT_SECRET: ${AURORA_JWT_SECRET}
      # `05` §8 e T8: o determinismo do adapter vem daqui, e a queda de sessao da
      # P3-10 e funcao dele. Sem a variavel o processo RECUSA o boot.
      RANDOM_SEED: ${RANDOM_SEED}
    volumes:
      - ./.aurora-pack:/pack:ro
    ports:
      - "127.0.0.1:${AURORA_ACADEMUS_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      # Toda rota da `academus-api` exige token, entao a saude aqui e "o
      # processo montou e responde HTTP" — 401 e resposta, e nao falha.
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()
      interval: 5s
      timeout: 5s
      retries: 12

  # -------------------------------------------------------------------------
  # O TOOLCHAIN DO CLIENTE, EM CONTAINER PINADO — Fase 4, peca 6.
  #
  # POR QUE CONTAINER, E NAO `node` NO HOST
  # ----------------------------------------
  # Nao ha `node` nem `npm` nesta maquina, e instalar no host resolveria UMA
  # maquina: o CI continuaria com a versao que o runner tiver, e passariam a
  # existir duas versoes possiveis do toolchain sem nada garantindo que sao a
  # mesma. Com a imagem pinada por digest, o build que roda aqui e o MESMO que
  # roda no CI, e o toolchain entra sob a regra de `00` secao 8 / `06` T15 como
  # qualquer outra dependencia — `scripts/check_pinned_images.py` ja cobra
  # digest e igualdade entre este arquivo e o workflow.
  #
  # `profiles` mantem o servico FORA do `docker compose up`: ele nao e parte da
  # stack, e sim uma ferramenta que roda e sai.
  #
  #     docker compose --profile build run --rm web-build
  #
  # O comando e a PROVA NEGATIVA do proprio gate, e nao `npm run build` — ver o
  # cabecalho de `range-core/web/prova_do_build.sh`: `vite build` sai 0 com o
  # TypeScript quebrado, e um gate que nunca foi visto reprovando e atestacao.
  # -------------------------------------------------------------------------
  web-build:
    profiles: ["build"]
    image: node:22.11.0-alpine@sha256:b64ced2e7cd0a4816699fe308ce6e8a08ccba463c757c00c14cd372e3d2c763e
    working_dir: /web
    volumes:
      - ./range-core/web:/web
    command: ["sh", "prova_do_build.sh"]

volumes:
  aurora_pgdata:
    name: ${AURORA_PGDATA_VOLUME:-aurora_pgdata}
