# SUPERFICIE DA `academus-api` — declarada ANTES de a rota existir.
#
# Autoridade: 07_IMPLEMENTATION_PHASES.md Fase 3; 01_ARCHITECTURE.md secao 5.4;
# 03_EXERCISE_DESIGN.md secao 7; 05_SECURITY_REQUIREMENTS.md secao 8.
#
# Lido por `scripts/check_api_surface.py`, que exige IGUALDADE nas duas direcoes
# contra as rotas de fato implementadas em `domains/academus/api/`.
#
# ---------------------------------------------------------------------------
# POR QUE ESTE ARQUIVO EXISTE, E POR QUE ELE COMECA QUASE VAZIO
# ---------------------------------------------------------------------------
#
# Lista escrita antes do codigo SUBESTIMA — sempre. Se a garantia fosse "o que
# esta aqui e o que existe", ela valeria so para o que alguem lembrou de prever,
# e a rota esquecida seria exatamente a que ninguem declarou.
#
# Por isso a checagem nao le esta lista como documentacao: ela cobra as DUAS
# direcoes.
#
#   rota implementada e ausente daqui   -> REPROVA
#   rota daqui com `status: implementada` e ausente do codigo -> REPROVA
#   rota daqui com `status: planejada` que JA existe no codigo -> REPROVA
#
# A terceira e o que impede `planejada` de virar esconderijo: assim que a rota
# nasce, a entrada tem de ser promovida no mesmo commit. E a segunda impede a
# lista de envelhecer afirmando rota que sumiu.
#
# O que esta declarado ANTES do codigo, entao, nao e a lista completa — e a
# OBRIGACAO. Ela nasce cheia de `planejada` porque a DoD da Fase 3 nomeia o que
# a fase precisa entregar, e vazia de qualquer outra coisa.
#
# ---------------------------------------------------------------------------
# OS CAMPOS
# ---------------------------------------------------------------------------
#
# `efeito`      — o que a rota faz ao EXERCICIO: `nenhum` quando ela so le ou
#                 so move business state, e um dos valores de efeito quando ela
#                 grava evento. Obrigatorio em toda rota desde a peca 3 da Fase
#                 6: regra que so vale quando o campo existe se desliga apagando
#                 o campo.
#
# `emite`       — o `event_type` do catalogo que a rota grava. Exigido sempre que
#                 `efeito` nao for `nenhum`, e recusado quando for. A camada
#                 admitida aqui e `participant_action` ou `observable_evidence`:
#                 esta e aplicacao INSTRUMENTADA (`09` §2), e nao console de
#                 facilitacao.
#
#                 Os dois campos existiam so na superficie do nucleo. Passaram a
#                 existir aqui quando a instrumentacao chegou — era a P4-2, cujo
#                 gatilho declarado era o PRIMEIRO `append` fora do inject-engine.
#
# `papeis`      — papeis de DOMINIO. Nao confundir com os papeis de exercicio de
#                 `03` secao 7 (facilitador / operador / avaliador): misturar os
#                 dois poe desenho de exercicio dentro do adapter, que e a
#                 fronteira do invariante 1 vazando por onde o verificador nao
#                 olha — ele varre import, nao vocabulario.
#
# `flags`       — flags que a rota consulta para degradar. Cada nome e conferido
#                 contra `domains/<adapter>/flags.yaml`: rota que declara flag
#                 inexistente reprova, pela mesma regra que o loader aplica ao
#                 pack e que `scripts/check_spec_flags.py` aplica a spec.
#
#                 EM YAML, e nao em Python, pelo mesmo motivo da lista de
#                 pendentes: nome de flag dentro de `.py` e literal que
#                 `tools/check_contract_literals.py` recusa, e recusaria com
#                 razao.
#
# `degradacao`  — LISTA ESTRUTURADA, uma entrada por flag. Ate a peca 4 era
#                 prosa; a peca 5 e quem a torna executavel, e prosa nao executa.
#
#                 A forma e a mesma familia dos `effects` do pack: a Fase 2
#                 recusou `if` espalhado e pos o efeito na declaracao. Aqui:
#
#                   - flag:     o nome, conferido contra `flags.yaml`
#                     condicao: `ligada` (flag boolean) | `proporcional` (number)
#                     efeito:   `recusa` | `latencia`
#                     status:   codigo HTTP, so para `recusa`
#                     mensagem: o que o PARTICIPANTE le — ver abaixo
#                     segundos: so para `latencia`
#
#                 `condicao` e conferida contra o TIPO da flag em `flags.yaml`:
#                 `ligada` sobre flag `number` reprova, e `proporcional` sobre
#                 boolean tambem. Sem isso, uma flag de 0 a 1 tratada como
#                 booleana degradaria com 0.0 — que e o mundo normal.
#
#                 `flags` e `degradacao` sao conferidos como CONJUNTOS IGUAIS:
#                 flag declarada sem efeito e promessa que ninguem cumpre, e
#                 efeito sobre flag nao declarada e a porta que a checagem de
#                 nome de flag existe para fechar.
#
# `mensagem`    — O TEXTO QUE O PARTICIPANTE LE, e ele nao pode explicar a si
#                 mesmo. A sala precisa VER o sistema cair, nao ler um aviso
#                 dizendo que ele foi derrubado: uma resposta com "flag ativa"
#                 no corpo transforma exercicio em demonstracao.
#
#                 `flags.yaml` ja escrevia isso em `effect_ui` — "Lancamento e
#                 alteracao de nota recusados; leitura e historico seguem
#                 disponiveis" — em linguagem de NEGOCIO, e e essa a linguagem
#                 aqui. A checagem recusa mensagem que contenha nome de flag ou
#                 vocabulario de mecanismo (`flag`, `simulacao`, `exercicio`,
#                 `inject`, `aurora`), e um teste varre a resposta inteira.
#
# `escopo`      — P3-3. `papel -> regra`, com duas regras e nada mais:
#
#                   `proprio` — o recurso E o sujeito (`sub` do token)
#                   `titular` — o recurso PERTENCE ao sujeito
#
#                 Papel ausente do mapa nao tem restricao de objeto: a
#                 `secretaria` ve qualquer aluno, e isso e do desenho.
#
#                 UM CAMPO, E NAO TRES — a pergunta que a P3-3 deixou aberta.
#                 Com tres entidades da para ver que todos os casos sao "um
#                 campo do recurso e igual ao `sub`", e o que muda entre eles e
#                 QUAL campo. Isso e valor, nao dimensao.
#
#                 A regra e aplicada DENTRO da busca do recurso, e nao depois
#                 dela: `repositorio.aluno(id, escopo)` devolve `None` tanto
#                 para ausente quanto para fora de escopo. Recurso alheio e
#                 recurso inexistente viram o MESMO caminho de codigo, e a
#                 indistinguibilidade da peca 4 vale sem ninguem se lembrar dela.
#
# `status`      — `planejada` ou `implementada`. Ver acima por que os dois
#                 estados sao verificaveis e nenhum deles mente por muito tempo.
#
# `publica`     — ausente vale `false`. **`papeis: []` NAO significa "todo
#                 mundo"**: significa ninguem, e a rota aberta e declarada por
#                 este campo. A checagem recusa as duas incoerencias — `publica`
#                 junto de papeis, e lista vazia sem `publica`.
#
#                 O sentido inverso seria pior exatamente no caso perigoso: uma
#                 rota que PERDESSE seus papeis numa edicao descuidada ficaria
#                 aberta, e o defeito nasceria silencioso.
#
# ---------------------------------------------------------------------------
# O TOKEN TAMBEM E SUPERFICIE — peca 4
# ---------------------------------------------------------------------------
#
# A peca 2 recusava papel de exercicio NA ROTA. O JWT e a outra porta pela qual
# desenho de exercicio entra no adapter, e nenhum verificador de import enxerga
# um claim: um token com `persona: facilitador` nao importa nada de `domains/`
# nem de lugar nenhum.
#
# A guarda e ESTA, estendida — e nao uma segunda. Duas listas sobre a mesma
# fronteira divergem, e a que diverge em silencio e sempre a que ninguem olha.
#
# `token.claims` e conferido por AST contra o dicionario que `range-core/api/
# tokens.py::_payload` devolve, nas DUAS DIRECOES: claim que o codigo escreve e
# nao esta aqui reprova, e essa e a direcao que importa.
#
# `papeis_de_dominio` passou a ser lido em TEMPO DE EXECUCAO — `emitir_token` so
# assina papel que esteja nesta lista. Como a checagem recusa papel de exercicio
# aqui dentro, um token de `facilitador` deixa de ser proibido e passa a ser
# INEXPRIMIVEL: para existir, o papel precisaria estar na lista; para estar na
# lista, precisaria passar pelo gate que o recusa por nome.
#
# ---------------------------------------------------------------------------
# IDIOMA DOS CAMINHOS — P4-1, fechada na peca 5 da Fase 4
# ---------------------------------------------------------------------------
#
# INGLES, por `CLAUDE.md` secao Idioma — "endpoints" esta na lista, junto de
# identificadores, tabelas, colunas, logs e nomes de flag e de evento. A mesma
# secao poe em portugues a interface, os dados sinteticos, os cenarios, as
# rubricas e a documentacao; caminho de rota nao e nenhum dos cinco.
#
# As cinco rotas da Fase 3 nasceram em portugues e foram renomeadas aqui:
#
#   /alunos/{aluno_id}            -> /students/{student_id}
#   /turmas/{turma_id}            -> /classes/{class_id}
#   /turmas/{turma_id}/diario     -> /classes/{class_id}/gradebook
#   /turmas/{turma_id}/notas      -> /classes/{class_id}/grades
#   /matricula                    -> /enrollment
#
# A renomeacao veio junto da P3-5 e nao a parte: `repositorio.py` inteiro muda
# de forma com o Postgres e os mesmos testes ja sao tocados. Renomear junto e
# uma edicao; renomear a parte sao duas.
#
# O QUE CONTINUA EM PORTUGUES, e nao e sobra: os VALORES de papel — `aluno`,
# `professor`, `secretaria`, `financeiro` — sao vocabulario de persona, que
# `03` secoes 6 e 7 escrevem assim, e nao identificador. E as `mensagem` de
# degradacao, que sao o texto que o PARTICIPANTE le, e interface esta na lista
# do portugues.
#
# A UNICA EXCECAO DO PROJETO E `/plateia`, e ela vive na superficie do NUCLEO:
# `01` secao 6 escreve o caminho da participant-view assim, literalmente, e
# documento normativo prevalece sobre a convencao. Esta dita la, no lugar em que
# ela ocorre.

# `persona` ENTROU NA PECA DO B1 DA SETIMA AUDITORIA, e o motivo esta em
# `01_ARCHITECTURE.md` §6 na forma que o spec-change #52 lhe deu.
#
# A frase anterior daquela secao dizia, sem qualificacao, que "domains/ nao pode
# conhecer persona" — e foi lida isolada duas vezes: por este verificador, que
# pos `persona` no vocabulario proibido de CLAIM, e pela implementacao, que
# emitiu `audit_query_performed` sem ela. O envelope entrou num store append-only
# violando `09` §1.1 e `contracts/events.schema.yaml`, cujo exemplo POSITIVO e
# este mesmo evento, com `producer: academus-api` e `persona: ti`.
#
# O QUE A GUARDA PROTEGE E A TOPOLOGIA, E NAO A PALAVRA:
#
#   `role`    autoriza a rota. Vocabulario de DOMINIO, conferido contra
#             `papeis_de_dominio` em tempo de execucao por `emitir_token`.
#   `persona` NAO autoriza nada. Atravessa ate o envelope, onde `09` §1.1 a
#             exige na camada `participant_action`.
#
# `papeis_de_dominio` passa a ser conferido por DISJUNCAO com as sete personas,
# alem dos tres papeis de exercicio: e ali que a topologia mora agora.
#
# O EMISSOR DESTE TOKEN E PROPRIO — `domains/academus/api/tokens.py`. Medido:
# `range-core/api/tokens.py::_payload` serve tambem o gm-console
# (`range-core/api/app.py:259`), e acrescentar `persona` la poria a claim no
# token de FACILITACAO. E o mesmo movimento que a superficie de participante fez
# na peca 3, pelo mesmo motivo: uma funcao unica assinando duas vocacoes.
token:
  claims:
    - sub
    - role
    - persona
    - exp

papeis_de_dominio:
  - aluno
  - professor
  - secretaria
  - financeiro

rotas:

  # -------------------------------------------------------------------------
  # ITEM 1 DA DoD — "academus.enrollment_offline: true faz o endpoint de
  # matricula retornar 503".
  # -------------------------------------------------------------------------
  - method: POST
    path: /enrollment
    papeis: [aluno, secretaria]
    escopo:
      aluno: proprio
    flags: [academus.enrollment_offline]
    degradacao:
      - flag: academus.enrollment_offline
        condicao: ligada
        efeito: recusa
        status: 503
        mensagem: 'O sistema de matricula esta temporariamente fora do ar. Tente novamente mais tarde.'
    status: implementada
    efeito: nenhum

  # -------------------------------------------------------------------------
  # ITEM 2 DA DoD — "academus.grades_readonly: true bloqueia POST de nota com
  # mensagem de negocio".
  #
  # MENSAGEM DE NEGOCIO, e nao 403 seco: o item pede que a recusa explique. Quem
  # recebe e um professor no meio de um lancamento, e "acesso negado" o manda
  # abrir chamado; "lancamento congelado por apuracao de integridade" o manda
  # falar com a coordenacao.
  # -------------------------------------------------------------------------
  - method: POST
    path: /classes/{class_id}/grades
    papeis: [professor, secretaria]
    escopo:
      professor: titular
    flags: [academus.grades_readonly]
    degradacao:
      - flag: academus.grades_readonly
        condicao: ligada
        efeito: recusa
        status: 409
        mensagem: 'O lancamento de notas esta suspenso por apuracao de integridade academica. Procure a coordenacao do curso.'
    status: implementada
    efeito: nenhum

  # -------------------------------------------------------------------------
  # A TERCEIRA ROTA DEGRADADA. `07` Fase 3 pede degradacao real em PELO MENOS
  # TRES endpoints, e a DoD nomeia so duas — esta fecha a conta.
  #
  # `lms_session_drop_rate` e `number` de 0 a 1, e nao booleana: a degradacao e
  # proporcional, e nao liga-desliga. E o unico caso desta fase em que o tipo da
  # flag muda a forma do efeito.
  # -------------------------------------------------------------------------
  - method: GET
    path: /classes/{class_id}/gradebook
    papeis: [professor, secretaria]
    escopo:
      professor: titular
    flags: [academus.lms_degraded, academus.lms_session_drop_rate]
    degradacao:
      - flag: academus.lms_degraded
        condicao: ligada
        efeito: latencia
        segundos: 2.5
      - flag: academus.lms_session_drop_rate
        condicao: proporcional
        efeito: recusa
        status: 503
        mensagem: 'Sua sessao foi encerrada. Faca login novamente para continuar.'
    status: implementada
    efeito: nenhum

  # -------------------------------------------------------------------------
  # AS TRES ENTIDADES de `07` Fase 3 precisam de leitura, e o RBAC precisa de
  # rota que NEGUE — o item 3 da DoD e "RBAC nega acesso cruzado entre perfis",
  # e negacao sem rota que a exerca nao e verificavel.
  #
  # AS DUAS IMPLEMENTADAS NA PECA 4, e sao estas duas por um motivo: `flags: []`.
  # A peca 4 e JWT e RBAC, e a degradacao por flag e a D4, que e da peca 5 —
  # tocar `if flag` aqui seria decidir a D4 de passagem, no lugar errado.
  # -------------------------------------------------------------------------
  - method: GET
    path: /students/{student_id}
    papeis: [aluno, secretaria]
    escopo:
      aluno: proprio
    flags: []
    degradacao: []
    status: implementada
    efeito: nenhum

  - method: GET
    path: /classes/{class_id}
    papeis: [professor, secretaria]
    escopo:
      professor: titular
    flags: []
    degradacao: []
    status: implementada
    efeito: nenhum

  # -------------------------------------------------------------------------
  # CONTINUA `planejada` NA PECA 4, POR DECISAO — e o motivo cabe aqui porque e
  # aqui que alguem vai perguntar por que a fase do JWT nao tem login.
  #
  # Emitir token exige AUTENTICAR UM USUARIO, e usuario nao e entidade da Fase 3:
  # `07` nomeia Aluno, Turma e Nota, e poe "seed em escala" nos NON-GOALS. Um
  # endpoint que assinasse o papel pedido no corpo da requisicao seria
  # vulnerabilidade intencional — proibida por `CLAUDE.md`, sem excecao.
  #
  # O JWT da fase existe e e exercitado: `Autenticacao.emitir_token` assina, a
  # suite bate nas rotas com token de verdade sobre o stack ASGI de verdade. O
  # que falta e a PORTA DE ENTRADA, e ela chega na Fase 5 com as personas do
  # seed. Ate la, a terceira direcao da checagem cobra a promocao no dia em que
  # a rota nascer.
  #
  # `publica: true` porque login autenticado por login nao existe. `papeis: []`
  # aqui significa ninguem, e e o `publica` que abre.
  # -------------------------------------------------------------------------
  - method: POST
    path: /auth/token
    papeis: []
    publica: true
    flags: []
    degradacao: []
    status: planejada
    efeito: nenhum

  # -------------------------------------------------------------------------
  # A VERIFICACAO DA CADEIA — `02` secao 4 item 5 e `06` T7. Peca 3 da Fase 5.
  #
  # DECLARADA ANTES DE EXISTIR, e promovida no mesmo commit em que a rota nasce:
  # a terceira direcao desta checagem cobra a promocao, e e ela que impede
  # `planejada` de virar esconderijo.
  #
  # AS TRES PERGUNTAS DA DISCIPLINA DA FASE 3, respondidas aqui porque o PERFIL
  # DE DOMINIO nao tem campo para duas delas:
  #
  #   papel exigido  `secretaria`. Nao ha papel de auditor no dominio, e criar um
  #                  seria por papel de EXERCICIO dentro do adapter — o buraco
  #                  que a peca 2 da Fase 3 fechou, e que `06` T6 cobra por
  #                  varredura de payload.
  #
  #   efeito         NENHUM sobre o exercicio. Le e conta; nao escreve, nao muda
  #                  flag, nao emite evento. `efeito` e campo do perfil do
  #                  NUCLEO — no perfil de dominio ele e proibido, junto de
  #                  `emite`, `inverso` e `confirmacao`, porque `emite` aqui
  #                  anteciparia a instrumentacao (P4-2).
  #
  #   reversivel     nao se aplica: nao ha o que reverter numa leitura.
  #
  # `flags: []` E DECISAO, e nao lista vazia por preguica. Degradar a verificacao
  # de integridade seria o range mentindo sobre a propria trilha: no meio de um
  # exercicio em que alguem pergunta "a trilha foi adulterada?", a resposta nao
  # pode depender de flag.
  #
  # A RESPOSTA CARREGA A POSICAO DA QUEBRA E NADA ALEM — sem despejo de linha,
  # sem payload de auditoria. `06` T7 exige a posicao exata; `06` T6 varre o
  # corpo procurando o que nao pode estar la.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # A CONSULTA DA TRILHA — item 1 da DoD da Fase 6, e o PRIMEIRO `append` do
  # adapter. Era o gatilho declarado da P4-2, fechada na parte 1 desta peca.
  #
  # `efeito: reversivel` porque ela GRAVA EVENTO: rota que grava evento move o
  # exercicio, por definicao, e o proprio verificador recusa `efeito: nenhum`
  # com `emite`. O que ela move e registro de observacao — `audit_query_performed`
  # e `effect_class: observation` —, e registro se reconstroi do fluxo.
  #
  # A rota e a FERRAMENTA da Linha B, e nao a resposta: devolve o que esta na
  # trilha, sem marcar nada como suspeito. Distinguir indevido de legitimo e o
  # trabalho que OBJ-03 e OBJ-04 medem.
  # -------------------------------------------------------------------------
  - method: GET
    path: /audit/grade-changes
    papeis: [secretaria]
    flags: []
    efeito: reversivel
    emite: audit_query_performed
    status: implementada

  - method: GET
    path: /audit/verify-chain
    papeis: [secretaria]
    flags: []
    degradacao: []
    status: implementada
    efeito: nenhum
