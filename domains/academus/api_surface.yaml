# SUPERFICIE DA `academus-api` — declarada ANTES de a rota existir.
#
# Autoridade: 07_IMPLEMENTATION_PHASES.md Fase 3; 01_ARCHITECTURE.md secao 5.4;
# 03_EXERCISE_DESIGN.md secao 7; 05_SECURITY_REQUIREMENTS.md secao 8.
#
# Lido por `scripts/check_api_surface.py`, que exige IGUALDADE nas duas direcoes
# contra as rotas de fato implementadas em `domains/academus/api/`.
#
# ---------------------------------------------------------------------------
# POR QUE ESTE ARQUIVO EXISTE, E POR QUE ELE COMECA QUASE VAZIO
# ---------------------------------------------------------------------------
#
# Lista escrita antes do codigo SUBESTIMA — sempre. Se a garantia fosse "o que
# esta aqui e o que existe", ela valeria so para o que alguem lembrou de prever,
# e a rota esquecida seria exatamente a que ninguem declarou.
#
# Por isso a checagem nao le esta lista como documentacao: ela cobra as DUAS
# direcoes.
#
#   rota implementada e ausente daqui   -> REPROVA
#   rota daqui com `status: implementada` e ausente do codigo -> REPROVA
#   rota daqui com `status: planejada` que JA existe no codigo -> REPROVA
#
# A terceira e o que impede `planejada` de virar esconderijo: assim que a rota
# nasce, a entrada tem de ser promovida no mesmo commit. E a segunda impede a
# lista de envelhecer afirmando rota que sumiu.
#
# O que esta declarado ANTES do codigo, entao, nao e a lista completa — e a
# OBRIGACAO. Ela nasce cheia de `planejada` porque a DoD da Fase 3 nomeia o que
# a fase precisa entregar, e vazia de qualquer outra coisa.
#
# ---------------------------------------------------------------------------
# OS CAMPOS
# ---------------------------------------------------------------------------
#
# `papeis`      — papeis de DOMINIO. Nao confundir com os papeis de exercicio de
#                 `03` secao 7 (facilitador / operador / avaliador): misturar os
#                 dois poe desenho de exercicio dentro do adapter, que e a
#                 fronteira do invariante 1 vazando por onde o verificador nao
#                 olha — ele varre import, nao vocabulario.
#
# `flags`       — flags que a rota consulta para degradar. Cada nome e conferido
#                 contra `domains/<adapter>/flags.yaml`: rota que declara flag
#                 inexistente reprova, pela mesma regra que o loader aplica ao
#                 pack e que `scripts/check_spec_flags.py` aplica a spec.
#
#                 EM YAML, e nao em Python, pelo mesmo motivo da lista de
#                 pendentes: nome de flag dentro de `.py` e literal que
#                 `tools/check_contract_literals.py` recusa, e recusaria com
#                 razao.
#
# `degradacao`  — o que a flag causa nesta rota. Declarativo: a implementacao
#                 le daqui em vez de espalhar `if flag:` por rota, que e a forma
#                 que nao sobrevive ao verificador de literais e o oposto do que
#                 a Fase 2 fez com `effects`.
#
# `status`      — `planejada` ou `implementada`. Ver acima por que os dois
#                 estados sao verificaveis e nenhum deles mente por muito tempo.
#
# `publica`     — ausente vale `false`. **`papeis: []` NAO significa "todo
#                 mundo"**: significa ninguem, e a rota aberta e declarada por
#                 este campo. A checagem recusa as duas incoerencias — `publica`
#                 junto de papeis, e lista vazia sem `publica`.
#
#                 O sentido inverso seria pior exatamente no caso perigoso: uma
#                 rota que PERDESSE seus papeis numa edicao descuidada ficaria
#                 aberta, e o defeito nasceria silencioso.
#
# ---------------------------------------------------------------------------
# O TOKEN TAMBEM E SUPERFICIE — peca 4
# ---------------------------------------------------------------------------
#
# A peca 2 recusava papel de exercicio NA ROTA. O JWT e a outra porta pela qual
# desenho de exercicio entra no adapter, e nenhum verificador de import enxerga
# um claim: um token com `persona: facilitador` nao importa nada de `domains/`
# nem de lugar nenhum.
#
# A guarda e ESTA, estendida — e nao uma segunda. Duas listas sobre a mesma
# fronteira divergem, e a que diverge em silencio e sempre a que ninguem olha.
#
# `token.claims` e conferido por AST contra o dicionario que `range-core/api/
# tokens.py::_payload` devolve, nas DUAS DIRECOES: claim que o codigo escreve e
# nao esta aqui reprova, e essa e a direcao que importa.
#
# `papeis_de_dominio` passou a ser lido em TEMPO DE EXECUCAO — `emitir_token` so
# assina papel que esteja nesta lista. Como a checagem recusa papel de exercicio
# aqui dentro, um token de `facilitador` deixa de ser proibido e passa a ser
# INEXPRIMIVEL: para existir, o papel precisaria estar na lista; para estar na
# lista, precisaria passar pelo gate que o recusa por nome.

token:
  claims:
    - sub
    - role
    - exp

papeis_de_dominio:
  - aluno
  - professor
  - secretaria
  - financeiro

rotas:

  # -------------------------------------------------------------------------
  # ITEM 1 DA DoD — "academus.enrollment_offline: true faz o endpoint de
  # matricula retornar 503".
  # -------------------------------------------------------------------------
  - method: POST
    path: /matricula
    papeis: [aluno, secretaria]
    flags: [academus.enrollment_offline]
    degradacao: 'HTTP 503 com pagina de manutencao enquanto a flag estiver ligada'
    status: planejada

  # -------------------------------------------------------------------------
  # ITEM 2 DA DoD — "academus.grades_readonly: true bloqueia POST de nota com
  # mensagem de negocio".
  #
  # MENSAGEM DE NEGOCIO, e nao 403 seco: o item pede que a recusa explique. Quem
  # recebe e um professor no meio de um lancamento, e "acesso negado" o manda
  # abrir chamado; "lancamento congelado por apuracao de integridade" o manda
  # falar com a coordenacao.
  # -------------------------------------------------------------------------
  - method: POST
    path: /turmas/{turma_id}/notas
    papeis: [professor, secretaria]
    flags: [academus.grades_readonly]
    degradacao: 'HTTP 409 com mensagem de negocio; leitura de nota segue disponivel'
    status: planejada

  # -------------------------------------------------------------------------
  # A TERCEIRA ROTA DEGRADADA. `07` Fase 3 pede degradacao real em PELO MENOS
  # TRES endpoints, e a DoD nomeia so duas — esta fecha a conta.
  #
  # `lms_session_drop_rate` e `number` de 0 a 1, e nao booleana: a degradacao e
  # proporcional, e nao liga-desliga. E o unico caso desta fase em que o tipo da
  # flag muda a forma do efeito.
  # -------------------------------------------------------------------------
  - method: GET
    path: /turmas/{turma_id}/diario
    papeis: [professor, secretaria]
    flags: [academus.lms_degraded, academus.lms_session_drop_rate]
    degradacao: 'latencia adicional e fracao de sessoes derrubada, proporcional a lms_session_drop_rate'
    status: planejada

  # -------------------------------------------------------------------------
  # AS TRES ENTIDADES de `07` Fase 3 precisam de leitura, e o RBAC precisa de
  # rota que NEGUE — o item 3 da DoD e "RBAC nega acesso cruzado entre perfis",
  # e negacao sem rota que a exerca nao e verificavel.
  #
  # AS DUAS IMPLEMENTADAS NA PECA 4, e sao estas duas por um motivo: `flags: []`.
  # A peca 4 e JWT e RBAC, e a degradacao por flag e a D4, que e da peca 5 —
  # tocar `if flag` aqui seria decidir a D4 de passagem, no lugar errado.
  # -------------------------------------------------------------------------
  - method: GET
    path: /alunos/{aluno_id}
    papeis: [aluno, secretaria]
    flags: []
    degradacao: 'nenhuma'
    status: implementada

  - method: GET
    path: /turmas/{turma_id}
    papeis: [professor, secretaria]
    flags: []
    degradacao: 'nenhuma'
    status: implementada

  # -------------------------------------------------------------------------
  # CONTINUA `planejada` NA PECA 4, POR DECISAO — e o motivo cabe aqui porque e
  # aqui que alguem vai perguntar por que a fase do JWT nao tem login.
  #
  # Emitir token exige AUTENTICAR UM USUARIO, e usuario nao e entidade da Fase 3:
  # `07` nomeia Aluno, Turma e Nota, e poe "seed em escala" nos NON-GOALS. Um
  # endpoint que assinasse o papel pedido no corpo da requisicao seria
  # vulnerabilidade intencional — proibida por `CLAUDE.md`, sem excecao.
  #
  # O JWT da fase existe e e exercitado: `Autenticacao.emitir_token` assina, a
  # suite bate nas rotas com token de verdade sobre o stack ASGI de verdade. O
  # que falta e a PORTA DE ENTRADA, e ela chega na Fase 5 com as personas do
  # seed. Ate la, a terceira direcao da checagem cobra a promocao no dia em que
  # a rota nascer.
  #
  # `publica: true` porque login autenticado por login nao existe. `papeis: []`
  # aqui significa ninguem, e e o `publica` que abre.
  # -------------------------------------------------------------------------
  - method: POST
    path: /auth/token
    papeis: []
    publica: true
    flags: []
    degradacao: 'nenhuma'
    status: planejada
