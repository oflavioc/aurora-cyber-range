# PACK DE EXEMPLO SANITIZADO — a fronteira publica demonstravel (CLAUDE.md
# secao "Ground truth") e o objeto do lint no CI (P7-9, decisao do operador
# em 13/09/2026, com a medicao que reviu a alternativa no registro da fase).
# ESPELHA a fixture limpa da suite de lint (tests/test_range_cli_lint.py):
# se as duas divergirem, uma das duas esta errada — e o lint acusa a que
# importa. Nenhum caso real: o ground_truth daqui e meia duzia de linhas
# sinteticas, e e por isso que este diretorio e a UNICA isencao do eixo (a)
# de check_gabarito_fora_do_git.py.
branches:
  - id: BR-A-CONTAINMENT
    line: A
    at_inject: A01
    evaluate:
      - id: contained_early
        when:
          all:
            - event: vpn_access_revoked
        next: A02
      - id: not_contained
        default: true
        next: A03
    reconverge_at: A03
